// ================= CITY WORLD =================
// the third world: a night city block. wireframe towers on soft-cornered
// islands of turf, black streets between, the creatures running the lanes
// like small traffic. same language again: flat dark fills, fine mesh
// strokes, dots for everything that glows.
var CITY_R = 62, CITY_SW = 13, CITY_BH = 2.4, CITY_EXT = CITY_R*0.85;
var cityX = [], cityZ = [], cityBlocks = [], cityBuildings = [], cityMerges = 0;
var CPAL = [ [0.99,0.86,0.66], [1.00,0.58,0.14], [0.985,0.71,0.52],
             [0.72,0.55,0.96], [1.00,0.84,0.79], [0.99,0.45,0.12] ];   // block tints: cream, orange, peach, violet, rose, ember
var CITY_RED = [1.0, 0.23, 0.35];                                      // traffic leaves a rosier thread

function cityLayout(){
  function roads(n){
    var a, S3=CITY_R/86;                           // road spacing tracks the town size
    if(n<=1)      a=[(rnd()-0.5)*24*S3];
    else if(n===2) a=[-(20+rnd()*14)*S3, (20+rnd()*14)*S3];
    else if(n===3) a=[-(38+rnd()*10)*S3, (rnd()-0.5)*12*S3, (38+rnd()*10)*S3];
    else           a=[-(48+rnd()*8)*S3, -(15+rnd()*4)*S3, (15+rnd()*4)*S3, (48+rnd()*8)*S3];
    a.sort(function(p,q){return p-q;});
    return a;
  }
  var v=Math.max(1, Math.min(4, Math.round(params.streets)));
  var nA=v, nB=Math.min(4, v+(rnd()<0.4?1:0));       // one axis sometimes runs a street heavier
  if(rnd()<0.5){ var nt=nA; nA=nB; nB=nt; }
  cityX=roads(nA); cityZ=roads(nB);
  cityBlocks=[]; cityBuildings=[]; cityMerges=0;
  var BND=CITY_R*0.99;
  function spans(rd){
    var s=[], lo=-BND, i;
    for(i=0;i<rd.length;i++){ s.push([lo, rd[i]-CITY_SW*0.5]); lo=rd[i]+CITY_SW*0.5; }
    s.push([lo,BND]);
    return s;
  }
  var SX=spans(cityX), SZ=spans(cityZ);
  // the raw cells of the grid
  var cells=[], ix, iz;
  for(ix=0;ix<SX.length;ix++) for(iz=0;iz<SZ.length;iz++){
    if(SX[ix][1]-SX[ix][0]<12 || SZ[iz][1]-SZ[iz][0]<12) continue;
    cells.push({ix:ix, iz:iz, x0:SX[ix][0], x1:SX[ix][1], z0:SZ[iz][0], z1:SZ[iz][1], grp:-1});
  }
  function cellAt(cx2,cz2){ for(var c=0;c<cells.length;c++){ if(cells[c].ix===cx2&&cells[c].iz===cz2) return cells[c]; } return null; }
  // the town grows over its own streets: neighbours stitch into pairs, straight threes and Ls.
  // bookkeeping keeps at least one segment of every road open, so the traffic always has a way round.
  var closedX=[], closedZ=[], i2;
  for(i2=0;i2<cityX.length;i2++) closedX.push(0);
  for(i2=0;i2<cityZ.length;i2++) closedZ.push(0);
  function crossings(list){                        // which street segments this stitch grows across
    var out=[];
    for(var m=0;m<list.length;m++) for(var q=m+1;q<list.length;q++){
      var A=list[m], B=list[q];
      if(A.iz===B.iz && Math.abs(A.ix-B.ix)===1) out.push(['x', Math.min(A.ix,B.ix)]);
      if(A.ix===B.ix && Math.abs(A.iz-B.iz)===1) out.push(['z', Math.min(A.iz,B.iz)]);
    }
    return out;
  }
  function canClose(crs){
    for(var m=0;m<crs.length;m++){ var r=crs[m];
      if(r[0]==='x'){ if(closedX[r[1]] >= SZ.length-1) return false; }
      else          { if(closedZ[r[1]] >= SX.length-1) return false; }
    }
    return true;
  }
  function commitClose(crs){ for(var m=0;m<crs.length;m++){ var r=crs[m]; if(r[0]==='x') closedX[r[1]]++; else closedZ[r[1]]++; } }
  var groups=[], tries=Math.round(cells.length/3.2)+1;
  for(var t=0;t<tries;t++){
    if(rnd()>0.78) continue;
    var a=cells[(rnd()*cells.length)|0];
    if(a.grp>=0) continue;
    var dx=(rnd()<0.5)?1:0, dz=1-dx;
    if(rnd()<0.5){ dx=-dx; dz=-dz; }
    var b=cellAt(a.ix+dx, a.iz+dz);
    if(!b || b.grp>=0) continue;
    var members=[a,b], shape="pair";
    if(rnd()<0.6){                                 // grow to a three: straight on, or turn the corner into an L
      var straight=(rnd()<0.45);
      var c2 = straight ? cellAt(b.ix+dx, b.iz+dz)
                        : cellAt(b.ix+(dz!==0?(rnd()<0.5?1:-1):0), b.iz+(dx!==0?(rnd()<0.5?1:-1):0));
      if(c2 && c2.grp<0){ members.push(c2); shape=straight?"three":"ell"; }
    }
    var crs=crossings(members);
    if(!canClose(crs)){
      if(members.length===3){ members.pop(); shape="pair"; crs=crossings(members); }
      if(!canClose(crs)) continue;
    }
    commitClose(crs);
    for(var m2=0;m2<members.length;m2++) members[m2].grp=groups.length;
    groups.push({cells:members, shape:shape});
    cityMerges++;
  }
  // rects: lone cells one each; stitched groups become one or two spanning rects wearing a single colour
  var ti=(rnd()*CPAL.length)|0;
  function pushRect(x0,x1,z0,z1,tint){
    var w=x1-x0, h=z1-z0;
    var cr=Math.min(4+rnd()*10, Math.min(w,h)*0.32);
    cityBlocks.push({ cx:(x0+x1)/2, cz:(z0+z1)/2, hx:w/2, hz:h/2, cr:cr, tint:tint, area:w*h });
  }
  function bounds(list){
    var x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(var m=0;m<list.length;m++){ var c=list[m];
      x0=Math.min(x0,c.x0); x1=Math.max(x1,c.x1); z0=Math.min(z0,c.z0); z1=Math.max(z1,c.z1); }
    return [x0,x1,z0,z1];
  }
  for(var g2=0;g2<groups.length;g2++){
    var G=groups[g2], T=CPAL[ti%CPAL.length]; ti+=1+((rnd()*2)|0);
    if(G.shape==="ell"){                           // an L: two overlapping arms wearing the same colour
      var bA=bounds([G.cells[0],G.cells[1]]);
      var bB=bounds([G.cells[1],G.cells[2]]);
      pushRect(bA[0],bA[1],bA[2],bA[3],T);
      pushRect(bB[0],bB[1],bB[2],bB[3],T);
    } else {
      var bb2=bounds(G.cells);
      pushRect(bb2[0],bb2[1],bb2[2],bb2[3],T);
    }
  }
  for(var c3=0;c3<cells.length;c3++){
    if(cells[c3].grp>=0) continue;
    var cc=cells[c3], T2=CPAL[ti%CPAL.length]; ti+=1+((rnd()*2)|0);
    pushRect(cc.x0,cc.x1,cc.z0,cc.z1,T2);
  }
}
function sdRect(b,x,z){                            // rounded-rect distance: <0 on the block, >0 in the street
  var qx=Math.abs(x-b.cx)-(b.hx-b.cr), qz=Math.abs(z-b.cz)-(b.hz-b.cr);
  var ax=Math.max(qx,0), az=Math.max(qz,0);
  return Math.sqrt(ax*ax+az*az)+Math.min(Math.max(qx,qz),0)-b.cr;
}
function sdCityIdx(x,z){
  var best=1e9, bi=0, i;
  for(i=0;i<cityBlocks.length;i++){ var d=sdRect(cityBlocks[i],x,z); if(d<best){ best=d; bi=i; } }
  return {d:best, i:bi};
}
function sdCity(x,z){ return sdCityIdx(x,z).d; }
function sdCityGrad(x,z,out){                      // which way is off the block?
  var e=0.6;
  var gx=sdCity(x+e,z)-sdCity(x-e,z), gz=sdCity(x,z+e)-sdCity(x,z-e);
  var l=Math.hypot(gx,gz)||1;
  out.x=gx/l; out.z=gz/l;
  return out;
}
function cityRise(d){ var t=clampf(-d/3.2,0,1); return t*t*(3-2*t); }  // the kerb: street to turf across three units
function cityRelief(x,z){ return (fbm(x*0.05+9.1, z*0.05-4.7, 2)-0.5)*0.6; }
function cityTopY(x,z){ var r=cityRise(sdCity(x,z)); return GROUND_Y+(CITY_BH+cityRelief(x,z))*r; }
function inBuilding(x,z,pad){
  for(var i=0;i<cityBuildings.length;i++){
    var f=cityBuildings[i];
    if(Math.abs(x-f.cx)<f.hx+pad && Math.abs(z-f.cz)<f.hz+pad) return true;
  }
  return false;
}
function buildingRing(x,z){                        // 1 hugging a facade, 0 six units out
  var m=0;
  for(var i=0;i<cityBuildings.length;i++){
    var f=cityBuildings[i];
    var dx=Math.max(Math.abs(x-f.cx)-f.hx,0), dz=Math.max(Math.abs(z-f.cz)-f.hz,0);
    var v=1-clampf(Math.hypot(dx,dz)/6,0,1);
    if(v>m) m=v;
  }
  return m;
}

function buildCityGround(){                        // streets and blocks are one heightfield: flat colour, stippled grain
  var seg=150, size=CITY_R*2.35, half=size/2, ix, iz, i;
  var vc=(seg+1)*(seg+1);
  var P=new Float32Array(vc*3), FC=new Float32Array(vc*3), C=[0,0,0];
  for(iz=0;iz<=seg;iz++) for(ix=0;ix<=seg;ix++){
    var vi=iz*(seg+1)+ix;
    var x=-half+ix/seg*size, z=-half+iz/seg*size;
    var rise=cityGroundCol(x,z,C);
    P[vi*3]=x; P[vi*3+1]=GROUND_Y+(CITY_BH+cityRelief(x,z))*rise; P[vi*3+2]=z;
    FC[vi*3]=C[0]; FC[vi*3+1]=C[1]; FC[vi*3+2]=C[2];
  }
  var idx=new Uint16Array(seg*seg*6), q=0;
  for(iz=0;iz<seg;iz++) for(ix=0;ix<seg;ix++){
    var a=iz*(seg+1)+ix, b=a+1, c=a+(seg+1), dd=c+1;
    if((ix+iz)%2===0){ idx[q++]=a; idx[q++]=c; idx[q++]=b; idx[q++]=b;  idx[q++]=c;  idx[q++]=dd; }
    else             { idx[q++]=a; idx[q++]=c; idx[q++]=dd; idx[q++]=a; idx[q++]=dd; idx[q++]=b; }
  }
  var g3=new THREE.BufferGeometry();
  g3.setAttribute("position", new THREE.BufferAttribute(P,3));
  g3.setAttribute("color",    new THREE.BufferAttribute(FC,3));
  g3.setIndex(new THREE.BufferAttribute(idx,1));
  envGroup.add(new THREE.Mesh(g3, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide})));
  // the grain: thousands of tiny darker specks knit the turf, warm dust settles along the kerbs
  var TN=20000, SN2=6500, cap=TN+SN2, made=0;
  var sp=new Float32Array(cap*3), sc=new Float32Array(cap*3);
  var guard=TN*3;
  while(made<TN && guard-->0){
    var b2=pickCityBlock();
    var gx=b2.cx+(rnd()*2-1)*(b2.hx+1.0), gz=b2.cz+(rnd()*2-1)*(b2.hz+1.0);
    if(sdRect(b2,gx,gz)>0.4) continue;                                  // turf and its kerb shoulder
    var rise2=cityGroundCol(gx,gz,C);
    if(rise2<0.12) continue;
    var sm=(rnd()<0.78)?0.42+rnd()*0.28:1.18;
    sp[made*3]=gx; sp[made*3+1]=cityTopY(gx,gz)+0.07; sp[made*3+2]=gz;
    sc[made*3]=Math.min(1,C[0]*sm); sc[made*3+1]=Math.min(1,C[1]*sm); sc[made*3+2]=Math.min(1,C[2]*sm);
    made++;
  }
  var made2=0; guard=SN2*8;
  while(made2<SN2 && guard-->0){
    var hx2=(rnd()*2-1)*CITY_R, hz2=(rnd()*2-1)*CITY_R;
    var d2=sdCity(hx2,hz2);
    if(d2<0.3||d2>8) continue;
    var w2=Math.exp(-d2/3.4);
    if(rnd()>w2) continue;
    var m2=(0.25+rnd()*0.6)*w2;
    var mi=(made+made2)*3;
    sp[mi]=hx2; sp[mi+1]=GROUND_Y+0.07; sp[mi+2]=hz2;
    sc[mi]=0.02+0.45*m2; sc[mi+1]=0.016+0.25*m2; sc[mi+2]=0.013+0.09*m2;
    made2++;
  }
  var tot=made+made2;
  var sg2=new THREE.BufferGeometry();
  sg2.setAttribute("position", new THREE.BufferAttribute(sp.slice(0,tot*3),3));
  sg2.setAttribute("color",    new THREE.BufferAttribute(sc.slice(0,tot*3),3));
  var gp=new THREE.Points(sg2, new THREE.PointsMaterial({vertexColors:true, size:0.12, sizeAttenuation:true}));
  gp.frustumCulled=false;
  envGroup.add(gp);
}
function cityGroundCol(x,z,C){                     // one palette rule for fill and grain alike; returns the kerb rise
  var sci=sdCityIdx(x,z), d=sci.d, T=cityBlocks[sci.i].tint;
  var rise=cityRise(d);
  var fade=1-sstep(CITY_R*0.58, CITY_R*1.04, Math.hypot(x,z)); fade=0.10+0.90*fade;
  var g=(d>0)?Math.exp(-d/4.4):1, g2=g*g;                              // lamplight pooling along the kerbs
  var sfr=0.028+0.40*g2, sfg=0.024+0.225*g2, sfb=0.022+0.078*g2;
  var patch=patchLight(x,z);
  var lp=0.34+0.34*fbm(x*0.11+5.0, z*0.11-7.0, 2);
  var green=clampf((fbm(x*0.06+3.7, z*0.06+11.2, 3)-0.52)*3.2, 0, 1)*rise;
  green=Math.max(green, buildingRing(x,z)*0.75*rise);                  // turf gathers at the feet of the towers
  var ei=clampf(1+d/5.0,0,1); ei*=ei;                                  // warm brow just inside the kerb
  var bfr=T[0]*lp, bfg=T[1]*lp, bfb=T[2]*lp;
  bfr=bfr*(1-green)+(0.09+0.14*patch)*green;
  bfg=bfg*(1-green)+(0.24+0.18*patch)*green;
  bfb=bfb*(1-green)+(0.045+0.05*patch)*green;
  bfr+=ei*0.24; bfg+=ei*0.14; bfb+=ei*0.05;
  C[0]=(sfr+(bfr-sfr)*rise)*fade;
  C[1]=(sfg+(bfg-sfg)*rise)*fade;
  C[2]=(sfb+(bfb-sfb)*rise)*fade;
  return rise;
}

// merged segmented boxes: everything built reads as one fine triangulated mesh
function segN(d){ return Math.max(1, Math.round(d/1.35)); }
function Merger(){ this.P=[]; this.I=[]; }
Merger.prototype.box=function(sx,sy,sz,x,y,z,rz){
  var g=new THREE.BoxGeometry(sx,sy,sz,segN(sx),segN(sy),segN(sz));
  var m=new THREE.Matrix4().makeTranslation(x,y,z);
  if(rz) m.multiply(new THREE.Matrix4().makeRotationZ(rz));
  g.applyMatrix4(m);
  var p=g.attributes.position.array, id=g.index.array, off=this.P.length/3, i;
  for(i=0;i<p.length;i++) this.P.push(p[i]);
  for(i=0;i<id.length;i++) this.I.push(id[i]+off);
  g.dispose();
};
Merger.prototype.finish=function(tint, mode){
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.P),3));
  g.setIndex(this.I);
  var grp=new THREE.Group();
  if(mode==="lichen"){                             // translucent glass shell, densely colonised by orange lichen
    g.computeVertexNormals();
    var glass=new THREE.MeshBasicMaterial({color:rgbHex(tint), side:THREE.DoubleSide,
                                           transparent:true, opacity:0.42, depthWrite:false});
    var shell=new THREE.Mesh(g, glass);
    shell.renderOrder=-1;                           // the glass lays down before its own lichen
    grp.add(shell);
    var pos=g.attributes.position, nor=g.attributes.normal;
    var tris=(this.I.length/3)|0, cap=Math.min(9500, Math.max(700,(tris*2.0)|0));
    var so=rnd()*83.0, sp=[], sc=[], lt=0;
    while(sp.length/3<cap && lt++<cap*6){
      var f=((rnd()*tris)|0)*3;
      var i0=this.I[f], i1=this.I[f+1], i2=this.I[f+2];
      var u=rnd(), v=rnd(); if(u+v>1){ u=1-u; v=1-v; }
      var w=1-u-v;
      var gx=pos.getX(i0)*w+pos.getX(i1)*u+pos.getX(i2)*v;
      var gy=pos.getY(i0)*w+pos.getY(i1)*u+pos.getY(i2)*v;
      var gz=pos.getZ(i0)*w+pos.getZ(i1)*u+pos.getZ(i2)*v;
      if(fbm(gx*0.4+so, gz*0.4+gy*0.35, 2)<0.40) continue;   // it grows in drifts, never a flat wash
      sp.push(gx+nor.getX(i0)*0.09, gy+nor.getY(i0)*0.09, gz+nor.getZ(i0)*0.09);
      sc.push(1.0, 0.44+rnd()*0.22, 0.05+rnd()*0.04);        // orange, breathing a little
    }
    var sg=new THREE.BufferGeometry();
    sg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(sp),3));
    sg.setAttribute("color",    new THREE.BufferAttribute(new Float32Array(sc),3));
    var pts=new THREE.Points(sg, new THREE.PointsMaterial({vertexColors:true, size:0.15, sizeAttenuation:true}));
    pts.frustumCulled=false;
    grp.add(pts);
  } else if(mode==="flat"){                        // one bright colour, nothing else
    grp.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:rgbHex(tint), side:THREE.DoubleSide})));
  } else {                                         // hand shading for the pale street furniture
    shadeGeo(g, tint, rnd()*61.0);
    grp.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide})));
  }
  return grp;
};
function shadeGeo(g, tint, so){                    // no lights in this world: shade by hand, one warm key from above
  g.computeVertexNormals();
  var pos=g.attributes.position, nor=g.attributes.normal, n=pos.count, i, yy;
  var yMin=1e9, yMax=-1e9;
  for(i=0;i<n;i++){ yy=pos.getY(i); if(yy<yMin)yMin=yy; if(yy>yMax)yMax=yy; }
  var span=Math.max(1e-3, yMax-yMin);
  var col=new Float32Array(n*3);
  for(i=0;i<n;i++){
    var lx=nor.getX(i)*0.52+nor.getY(i)*0.66+nor.getZ(i)*0.31;
    var hgt=(pos.getY(i)-yMin)/span;
    var mott=fbm(pos.getX(i)*0.30+so, pos.getZ(i)*0.30+pos.getY(i)*0.26, 2);
    var t=clampf(0.24+0.40*(lx*0.5+0.5)+0.22*hgt+(mott-0.5)*0.26, 0.05, 1.05);
    col[i*3]=Math.min(1,tint[0]*t); col[i*3+1]=Math.min(1,tint[1]*t); col[i*3+2]=Math.min(1,tint[2]*t);
  }
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  return g;
}
function rgbHex(c){ return (Math.round(c[0]*255)<<16)|(Math.round(c[1]*255)<<8)|Math.round(c[2]*255); }

function makeBuilding(b){
  var bw=b.hx*2, bh=b.hz*2;
  var mW=Math.min(bw-6, 10+rnd()*16), mD=Math.min(bh-6, 9+rnd()*13);
  if(mW<7||mD<7) return false;
  var cx=0, cz=0, ok=false, attempt=0;               // find a footprint clear of any standing neighbour
  while(attempt++<8 && !ok){
    cx=b.cx+(rnd()-0.5)*(bw-mW-5); cz=b.cz+(rnd()-0.5)*(bh-mD-5);
    ok=true;
    for(var bi=0;bi<cityBuildings.length;bi++){
      var fb=cityBuildings[bi];
      if(Math.abs(cx-fb.cx)<(mW/2+fb.hx+2.5) && Math.abs(cz-fb.cz)<(mD/2+fb.hz+2.5)){ ok=false; break; }
    }
  }
  if(!ok) return false;
  var y0=GROUND_Y+CITY_BH+0.2;
  var tint=(rnd()<0.66)?b.tint:CPAL[(rnd()*CPAL.length)|0];
  var M=new Merger(), u=rnd(), H, i, k, px, pz, lv;
  var hw=mW/2, hd=mD/2;
  var tall=(rnd()<0.22)?(1.7+rnd()*1.1):1;           // roughly one in five reaches for the sky
  if(u<0.36){
    // the arcade: a tall open colonnade at street level, banded storeys above
    var gH=5.5+rnd()*2.5, stor=Math.round((2+((rnd()*3)|0))*tall), sH=4.2+rnd()*1.6;
    var body=gH+stor*sH;
    H=0.8+body+1.1;
    M.box(mW,0.8,mD, cx,y0+0.4,cz);
    var stepC=3.8+rnd()*1.2;
    for(px=-hw+1.1; px<=hw-1.0; px+=stepC){
      M.box(1.2,gH,1.2, cx+px, y0+0.8+gH/2, cz-hd+0.7);
      M.box(1.2,gH,1.2, cx+px, y0+0.8+gH/2, cz+hd-0.7);
    }
    for(pz=-hd+1.1+stepC; pz<=hd-1.1-stepC*0.5; pz+=stepC){
      M.box(1.2,gH,1.2, cx-hw+0.7, y0+0.8+gH/2, cz+pz);
      M.box(1.2,gH,1.2, cx+hw-0.7, y0+0.8+gH/2, cz+pz);
    }
    for(k=0;k<stor;k++){
      var ys=y0+0.8+gH+k*sH;
      M.box(mW,1.1,mD, cx, ys+0.55, cz);                    // the band between storeys
      for(px=-hw+0.9; px<=hw-0.8; px+=2.6){                 // window piers
        M.box(0.9,sH-1.1,0.9, cx+px, ys+1.1+(sH-1.1)/2, cz-hd+0.5);
        M.box(0.9,sH-1.1,0.9, cx+px, ys+1.1+(sH-1.1)/2, cz+hd-0.5);
      }
    }
    M.box(mW,1.1,mD, cx, y0+0.8+body+0.55, cz);             // the roof
    M.box(mW-4.5, body*0.9, mD-4.5, cx, y0+0.8+body/2, cz);  // a soft inner mass, set well back from the glass
  } else if(u<0.64){
    // pilotis: fat columns, floating decks, everything open to the air
    var lifts=Math.round((3+((rnd()*3)|0))*tall), gap=4.4+rnd()*1.6;
    H=lifts*(gap+1.3);
    var nx=2+((rnd()*2)|0), cS=2.1+rnd()*0.9;
    for(i=0;i<nx;i++) for(k=0;k<2;k++){
      var colx=cx-hw+2.4+i*(mW-4.8)/(nx-1);
      var colz=cz-hd+2.4+k*(mD-4.8);
      for(lv=0;lv<lifts;lv++){
        var yb=y0+lv*(gap+1.3);
        M.box(cS,gap,cS, colx, yb+gap/2, colz);
        M.box(cS+1.6,1.0,cS+1.6, colx, yb+gap-0.5, colz);   // the flare where it meets the deck
      }
    }
    for(lv=1;lv<=lifts;lv++) M.box(mW,1.3,mD, cx, y0+lv*(gap+1.3)-0.65, cz);
    var yp=y0+H+0.35;
    M.box(mW,0.7,0.5, cx, yp, cz-hd+0.25); M.box(mW,0.7,0.5, cx, yp, cz+hd-0.25);
    M.box(0.5,0.7,mD, cx-hw+0.25, yp, cz); M.box(0.5,0.7,mD, cx+hw-0.25, yp, cz);
  } else {
    // wings: parallel slabs and a crossbar, slotted with piers — an H seen from above
    H=(15+rnd()*13)*tall;
    var bars=2+(rnd()<0.4?1:0), tz=4.4+rnd()*1.8;
    for(i=0;i<bars;i++){
      var oz=-hd+tz/2 + i*(mD-tz)/(bars-1);
      M.box(mW,H,tz, cx, y0+H/2, cz+oz);
      for(px=-hw+1.0; px<=hw-0.9; px+=2.4){                 // the slot rhythm
        M.box(0.8,H*0.92,0.7, cx+px, y0+H*0.46, cz+oz-tz/2-0.32);
        M.box(0.8,H*0.92,0.7, cx+px, y0+H*0.46, cz+oz+tz/2+0.32);
      }
    }
    var tx=4.2+rnd()*1.6, ox=(rnd()-0.5)*(mW-tx)*0.6;
    M.box(tx,H,mD, cx+ox, y0+H/2, cz);
    if(rnd()<0.4) M.box(tx,H*0.8,mD, cx-ox, y0+H*0.4, cz);
  }
  if(rnd()<0.7) M.box(2.2+rnd()*2, 1.6+rnd()*1.2, 2+rnd()*2, cx+(rnd()-0.5)*mW*0.4, y0+H+0.8, cz+(rnd()-0.5)*mD*0.4);  // plant room
  if(rnd()<0.6) M.box(0.22, (3.5+rnd()*2.5)*(tall>1?1.5:1), 0.22, cx+(rnd()-0.5)*mW*0.5, y0+H+2.2, cz+(rnd()-0.5)*mD*0.5);  // aerial, taller on the high ones
  envGroup.add(M.finish(tint, "lichen"));
  cityBuildings.push({cx:cx, cz:cz, hx:hw, hz:hd});
  envObstacles.push({x:cx, z:cz, r:Math.min(hw,hd)*0.95});
  return true;
}
function buildCityBuildings(){
  var mul=params.towers;
  for(var i=0;i<cityBlocks.length;i++){
    var b=cityBlocks[i], mn=Math.min(b.hx,b.hz)*2;
    var p=((mn>=20)?0.85:(mn>=14?0.5:0.2))*mul;
    if(rnd()<p) makeBuilding(b);
    if(mn>=40 && rnd()<0.6*Math.min(mul,1.5)) makeBuilding(b);   // the big blocks can carry two
  }
  if(!cityBuildings.length && cityBlocks.length && mul>0){       // never an accidental ghost town
    var order=cityBlocks.slice().sort(function(a,b2){ return b2.area-a.area; });
    for(var k=0;k<order.length;k++){ if(makeBuilding(order[k])) break; }
  }
}

function nearRoad(x,z){                             // is there an actual road running past this spot?
  var i;
  for(i=0;i<cityX.length;i++) if(Math.abs(x-cityX[i])<CITY_SW*0.85) return true;
  for(i=0;i<cityZ.length;i++) if(Math.abs(z-cityZ[i])<CITY_SW*0.85) return true;
  return false;
}
function buildCityLamps(){                          // pale masts leaning their jibs out over the road
  var want=3+((rnd()*3)|0), placed=0, guard=0;
  while(placed<want && guard++<90){
    var b=cityBlocks[(rnd()*cityBlocks.length)|0];
    var sx=rnd()<0.5?-1:1, sz=rnd()<0.5?-1:1;
    var lx=b.cx+sx*(b.hx-b.cr*0.55), lz=b.cz+sz*(b.hz-b.cr*0.55);
    if(sdRect(b,lx,lz)>-0.7){ lx=b.cx+sx*(b.hx-b.cr*0.9); lz=b.cz+sz*(b.hz-b.cr*0.9); }
    if(!nearRoad(lx,lz)) continue;                  // no lighting the void at the edge of town
    if(inBuilding(lx,lz,2.5)) continue;
    var M=new Merger(), mh=13+rnd()*6, jl=8+rnd()*5, drop=4.5+rnd()*2.5;
    M.box(0.8,mh*0.55,0.8, 0, mh*0.275, 0);
    M.box(0.55,mh*0.5,0.55, 0, mh*0.75, 0);
    var jL=Math.hypot(jl,drop), ja=Math.atan2(drop,jl);
    M.box(jL,0.32,0.32, jl*0.5, mh-drop*0.5, 0, -ja);       // the jib, reaching down over the street
    var bdx=jl*0.5, bdy=mh*0.45-drop*0.5;
    M.box(Math.hypot(bdx,bdy),0.22,0.22, jl*0.25, (mh*0.55+mh-drop*0.5)/2, 0, Math.atan2(bdy,bdx));  // the stay
    M.box(0.9,1.2,0.9, jl, mh-drop-0.55, 0);                // the head
    M.box(0.16,1.2,0.16, jl, mh-drop-1.7, 0);               // and its little pendant
    var grp=M.finish([0.93,0.90,0.84], false);
    grp.rotation.y=Math.atan2(-sz, sx);
    grp.position.set(lx, cityTopY(lx,lz), lz);
    envGroup.add(grp);
    envObstacles.push({x:lx, z:lz, r:1.5});
    placed++;
  }
}

function buildCitySigns(){                          // signposts by the kerb, big plates in the creatures' colours
  var SPAL=[[0.16,0.30,0.98],[1.0,0.83,0.20],[1.0,0.35,0.55],[0.35,0.90,0.85],[1.0,0.48,0.09]];
  var G={x:0,z:0};
  var want=3+((rnd()*4)|0), placed=0, guard=0;
  while(placed<want && guard++<110){
    var b=cityBlocks[(rnd()*cityBlocks.length)|0];
    var a=rnd()*6.2832;
    var x=b.cx+Math.cos(a)*(b.hx-1.8), z=b.cz+Math.sin(a)*(b.hz-1.8);
    var d=sdRect(b,x,z);
    if(d>-0.8||d<-3.6) continue;                    // right by the kerb, facing the road
    if(!nearRoad(x,z)) continue;
    if(inBuilding(x,z,1.8)) continue;
    var M=new Merger(), h=6.0+rnd()*3.0;
    M.box(0.30,h,0.30, 0,h/2,0);
    var grp=M.finish([0.94,0.92,0.88], "flat");
    var pw=2.6+rnd()*1.6, ph=1.4+rnd()*0.8;
    var plate=new THREE.Mesh(new THREE.BoxGeometry(pw,ph,0.16,3,3,1),
                             new THREE.MeshBasicMaterial({color:rgbHex(pick(SPAL))}));
    plate.position.set(0, h-ph*0.5-0.10, 0);
    grp.add(plate);
    if(rnd()<0.5){                                  // a second smaller plate, turned crossways
      var p2=new THREE.Mesh(new THREE.BoxGeometry(pw*0.6,ph*0.65,0.16,3,3,1),
                            new THREE.MeshBasicMaterial({color:rgbHex(pick(SPAL))}));
      p2.position.set(0, h-ph-0.95, 0);
      p2.rotation.y=Math.PI/2;
      grp.add(p2);
    }
    sdCityGrad(x,z,G);
    grp.rotation.y=Math.atan2(G.x,G.z);             // the plate reads to the street
    grp.position.set(x, cityTopY(x,z), z);
    envGroup.add(grp);
    envObstacles.push({x:x, z:z, r:1.35});
    placed++;
  }
}
function buildCityShelters(){                       // a bus shelter or two: pale glass box, bright orange roof, open to the road
  var G={x:0,z:0};
  var want=1+((rnd()*2)|0), placed=0, guard=0;
  while(placed<want && guard++<90){
    var b=cityBlocks[(rnd()*cityBlocks.length)|0];
    var a=rnd()*6.2832;
    var x=b.cx+Math.cos(a)*(b.hx-3.2), z=b.cz+Math.sin(a)*(b.hz-3.2);
    var d=sdRect(b,x,z);
    if(d>-1.4||d<-4.2) continue;
    if(!nearRoad(x,z)) continue;                    // only ever at the side of a road
    if(inBuilding(x,z,3.0)) continue;
    var M=new Merger();
    var W3=5.5+rnd()*1.5, H3=3.4+rnd()*0.6, D3=2.2;
    M.box(W3,H3*0.82,0.18, 0, H3*0.47, -D3*0.5);    // the back glass
    M.box(0.18,H3*0.82,D3, -W3/2+0.09, H3*0.47, 0); // the sides
    M.box(0.18,H3*0.82,D3,  W3/2-0.09, H3*0.47, 0);
    M.box(0.22,H3,0.22, -W3/2+0.14, H3/2, D3*0.42); // front posts
    M.box(0.22,H3,0.22,  W3/2-0.14, H3/2, D3*0.42);
    M.box(W3*0.62,0.16,0.62, 0, 1.05, -D3*0.16);    // the bench
    var grp=M.finish([0.86,0.93,0.96], "flat");     // pale and bright
    var roof=new THREE.Mesh(new THREE.BoxGeometry(W3+0.9,0.24,D3+0.9,4,1,3),
                            new THREE.MeshBasicMaterial({color:rgbHex([1.0,0.52,0.10])}));
    roof.position.set(0, H3+0.12, 0);               // the orange roof, seen from every rooftop and street
    grp.add(roof);
    sdCityGrad(x,z,G);
    grp.rotation.y=Math.atan2(G.x,G.z);             // it opens onto the road
    grp.position.set(x, cityTopY(x,z), z);
    envGroup.add(grp);
    envObstacles.push({x:x, z:z, r:3.2});
    placed++;
  }
}

function buildCityProps(){                          // bins, posts, the odd small standing figure
  function grey(geo,x,y,z,ry){
    shadeGeo(geo, [0.72,0.74,0.79], rnd()*50.0);
    var m=new THREE.Mesh(geo, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide}));
    m.position.set(x,y,z); if(ry) m.rotation.y=ry;
    envGroup.add(m);
  }
  for(var i=0;i<cityBlocks.length;i++){
    var b=cityBlocks[i], n=1+((rnd()*3)|0);
    for(var k=0;k<n;k++){
      var a=rnd()*6.2832;
      var x=b.cx+Math.cos(a)*(b.hx-2.2), z=b.cz+Math.sin(a)*(b.hz-2.2);
      if(sdRect(b,x,z)>-1.2) continue;
      if(inBuilding(x,z,1.2)) continue;
      var y=cityTopY(x,z), u=rnd();
      if(u<0.4) grey(new THREE.CylinderGeometry(0.7,0.85,1.9,9,3), x, y+0.95, z, rnd()*6.28);
      else if(u<0.7) grey(new THREE.BoxGeometry(0.9,2.3,0.9,2,4,2), x, y+1.15, z, rnd()*6.28);
      else { grey(new THREE.IcosahedronGeometry(0.75,1), x, y+0.8, z); grey(new THREE.IcosahedronGeometry(0.45,1), x, y+1.85, z); }
      envObstacles.push({x:x, z:z, r:1.2});
    }
  }
  var s=1+((rnd()*3)|0);                             // and one or two out in the road itself
  for(var q=0;q<s;q++){
    var gx=(rnd()*2-1)*CITY_R*0.8, gz=(rnd()*2-1)*CITY_R*0.8;
    var d=sdCity(gx,gz);
    if(d<1.0||d>3.2) continue;
    grey(new THREE.CylinderGeometry(0.6,0.7,1.7,9,3), gx, GROUND_Y+0.85, gz, rnd()*6.28);
    envObstacles.push({x:gx, z:gz, r:1.3});
  }
}

function pickCityBlock(){
  var tot=0, i;
  for(i=0;i<cityBlocks.length;i++) tot+=cityBlocks[i].area;
  var r=rnd()*tot;
  for(i=0;i<cityBlocks.length;i++){ r-=cityBlocks[i].area; if(r<=0) return cityBlocks[i]; }
  return cityBlocks[cityBlocks.length-1];
}
function buildCityGreens(){                         // turf on the blocks, sprouts in the cracks of the road
  var target=Math.floor(46000*params.grass), tries=target*2;
  var extra=Math.floor(700*params.grass);
  var cap=target+extra;
  var pos=new Float32Array(cap*12), col=new Float32Array(cap*12), n=0, C=[0,0,0], i, o;
  for(i=0;i<tries && n<target;i++){
    var b=pickCityBlock();
    var x=b.cx+(rnd()*2-1)*(b.hx-0.8), z=b.cz+(rnd()*2-1)*(b.hz-0.8);
    var d=sdRect(b,x,z); if(d>-1.0) continue;
    if(inBuilding(x,z,0.35)) continue;
    var L=patchLight(x,z), ring=buildingRing(x,z);
    var keep=0.14+0.86*clampf(L*1.05+ring*0.9, 0, 1);
    if(rnd()>keep) continue;
    var y0=cityTopY(x,z);
    var h=(1.6+rnd()*1.7)*(0.8+0.55*Math.max(L,ring*0.8));
    var fa=fbm(x*0.02+51.0, z*0.02+13.0, 2)*12.566+(rnd()-0.5)*1.4;
    var lm=(0.25+rnd()*0.7);
    var lx=Math.cos(fa)*lm, lz=Math.sin(fa)*lm;
    gcol(clampf(Math.max(L,ring*0.7)+(rnd()-0.5)*0.2, 0, 1), C);
    var fadeR=1-sstep(CITY_R*0.58, CITY_R*1.02, Math.hypot(x,z));
    var m=(0.45+0.55*fadeR);
    var r0=C[0]*m, g0=C[1]*m, b0=C[2]*m;
    o=n*12;
    pos[o]=x;            pos[o+1]=y0;         pos[o+2]=z;
    pos[o+3]=x+lx*0.35;  pos[o+4]=y0+h*0.62;  pos[o+5]=z+lz*0.35;
    pos[o+6]=pos[o+3];   pos[o+7]=pos[o+4];   pos[o+8]=pos[o+5];
    pos[o+9]=x+lx;       pos[o+10]=y0+h;      pos[o+11]=z+lz;
    col[o]  =r0*0.35; col[o+1]=g0*0.35; col[o+2]=b0*0.35;
    col[o+3]=r0*0.85; col[o+4]=g0*0.85; col[o+5]=b0*0.85;
    col[o+6]=col[o+3]; col[o+7]=col[o+4]; col[o+8]=col[o+5];
    col[o+9]=Math.min(1,r0*1.15); col[o+10]=Math.min(1,g0*1.15); col[o+11]=Math.min(1,b0*1.15);
    n++;
  }
  var made2=0;
  for(i=0;i<extra*4 && made2<extra;i++){
    var sx2=(rnd()*2-1)*CITY_R*0.92, sz2=(rnd()*2-1)*CITY_R*0.92;
    var d2=sdCity(sx2,sz2); if(d2<1.0||d2>CITY_SW) continue;
    var h2=0.6+rnd()*1.0, a2=rnd()*6.2832, l2=0.2+rnd()*0.4;
    var lx2=Math.cos(a2)*l2, lz2=Math.sin(a2)*l2;
    var mm=0.10+rnd()*0.16;
    o=n*12;
    pos[o]=sx2;            pos[o+1]=GROUND_Y;          pos[o+2]=sz2;
    pos[o+3]=sx2+lx2*0.4;  pos[o+4]=GROUND_Y+h2*0.6;   pos[o+5]=sz2+lz2*0.4;
    pos[o+6]=pos[o+3];     pos[o+7]=pos[o+4];          pos[o+8]=pos[o+5];
    pos[o+9]=sx2+lx2;      pos[o+10]=GROUND_Y+h2;      pos[o+11]=sz2+lz2;
    col[o]=0.02;      col[o+1]=0.05;    col[o+2]=0.012;
    col[o+3]=mm*0.35; col[o+4]=mm;      col[o+5]=mm*0.22;
    col[o+6]=col[o+3]; col[o+7]=col[o+4]; col[o+8]=col[o+5];
    col[o+9]=mm*0.45; col[o+10]=Math.min(1,mm*1.2); col[o+11]=mm*0.3;
    n++; made2++;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos.slice(0,n*12),3));
  g.setAttribute("color",    new THREE.BufferAttribute(col.slice(0,n*12),3));
  envGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true})));
}

function cityCluster(cx,cz,count,sigma,pal){
  for(var i=0;i<count;i++){
    var a=rnd()*6.2832, r=sigma*Math.sqrt(rnd())*(1+rnd()*0.5);
    var x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
    if(sdCity(x,z)>-1.1) continue;
    if(inBuilding(x,z,0.4)) continue;
    addFlower(x, cityTopY(x,z), z, 0.45+rnd()*0.6, pal, 1);
  }
}
function buildCityFlowers(){
  var mul=params.flowers, i, k;
  for(i=0;i<cityBuildings.length;i++){               // beds against the facades
    var f=cityBuildings[i], nc=2+((rnd()*2)|0);
    for(k=0;k<nc;k++){
      var a=rnd()*6.2832;
      cityCluster(f.cx+Math.cos(a)*(f.hx+2.5+rnd()*3), f.cz+Math.sin(a)*(f.hz+2.5+rnd()*3),
                  Math.round((8+rnd()*14)*mul), 2.2+rnd()*2.2, pickPal());
    }
  }
  for(i=0;i<cityBlocks.length;i++){
    var b=cityBlocks[i], nr=1+((rnd()*3)|0);
    for(k=0;k<nr;k++){                                // drifts along the kerbs
      var a2=rnd()*6.2832;
      cityCluster(b.cx+Math.cos(a2)*(b.hx-3.5), b.cz+Math.sin(a2)*(b.hz-3.5),
                  Math.round((6+rnd()*12)*mul), 2.5+rnd()*2.5, pickPal());
    }
    var tw=(rnd()<0.75)?(3+((rnd()*7)|0)):0, tg=0;    // berry twigs in ones and threes
    while(tw>0 && tg++<60){
      var ta=rnd()*6.2832;
      var tx=b.cx+Math.cos(ta)*(b.hx-2.5)*rnd(), tz2=b.cz+Math.sin(ta)*(b.hz-2.5)*rnd();
      if(sdRect(b,tx,tz2)>-1.4) continue;
      if(inBuilding(tx,tz2,0.6)) continue;
      addTwig(tx, tz2, 0.7+rnd()*0.6, cityTopY(tx,tz2)-0.15);
      tw--;
    }
    var cf=1+((rnd()*3)|0);                           // confetti: little congregations of colour in the turf
    for(k=0;k<cf;k++){
      var ca=rnd()*6.2832;
      var ccx=b.cx+Math.cos(ca)*(b.hx-3)*rnd(), ccz=b.cz+Math.sin(ca)*(b.hz-3)*rnd();

      var nd=Math.round((14+rnd()*22)*mul);
      for(var q2=0;q2<nd;q2++){

      }
    }
    var lt=Math.round((16+rnd()*20)*mul);             // litter drifting along the gutter
    for(k=0;k<lt;k++){
      var la=rnd()*6.2832;
      var px2=b.cx+Math.cos(la)*(b.hx+0.5), pz2=b.cz+Math.sin(la)*(b.hz+0.5);
      var d3=sdCity(px2,pz2);

    }
  }
  var ln=Math.round(130*mul);                         // loners in the open turf
  for(i=0;i<ln;i++){
    var b2=pickCityBlock();
    var x3=b2.cx+(rnd()*2-1)*(b2.hx-2), z3=b2.cz+(rnd()*2-1)*(b2.hz-2);
    if(sdRect(b2,x3,z3)>-1.2) continue;
    if(inBuilding(x3,z3,0.4)) continue;
    addFlower(x3, cityTopY(x3,z3), z3, 0.5+rnd()*0.7, pickPal(), 1);
  }
  var ns=Math.round(320*mul);                         // tiny understory specks
  for(i=0;i<ns;i++){
    var b3=pickCityBlock();
    var x4=b3.cx+(rnd()*2-1)*(b3.hx-1.5), z4=b3.cz+(rnd()*2-1)*(b3.hz-1.5);
    if(sdRect(b3,x4,z4)>-1.0) continue;
    if(inBuilding(x4,z4,0.3)) continue;
    var cc=rnd()<0.14?FPAL.red:(rnd()<0.5?FPAL.cream:FPAL.yellow);
    addDot(x4, cityTopY(x4,z4)+0.9+rnd()*1.1, z4, cc, 0.12+rnd()*0.14);
  }
}

function buildCityHaze(){                            // soft additive sprites: streetlight bloom along the kerbs
  var N=2400, P=[], S=[], made=0, guard=N*8;
  while(made<N && guard-->0){
    var x=(rnd()*2-1)*CITY_R, z=(rnd()*2-1)*CITY_R;
    var d=sdCity(x,z);
    if(d<0.1||d>7) continue;
    if(rnd()>Math.exp(-d/3.0)) continue;
    P.push(x, GROUND_Y+0.25+rnd()*2.4, z);
    S.push(2.6+rnd()*5.2);
    made++;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(P),3));
  g.setAttribute("hsize",    new THREE.BufferAttribute(new Float32Array(S),1));
  envHazeMat=new THREE.ShaderMaterial({
    uniforms:{ uProj:{value:projScale} },
    vertexShader:[
      "attribute float hsize; uniform float uProj;",
      "void main(){",
      "  vec4 mv=modelViewMatrix*vec4(position,1.0);",
      "  gl_PointSize=clamp(hsize*uProj/max(-mv.z,0.001),1.0,96.0);",
      "  gl_Position=projectionMatrix*mv;",
      "}"].join("\n"),
    fragmentShader:[
      "precision mediump float;",
      "void main(){",
      "  vec2 uv=gl_PointCoord-0.5; float d2=dot(uv,uv);",
      "  if(d2>0.25) discard;",
      "  float a=1.0-sqrt(d2)*2.0; a=a*a*0.13;",
      "  gl_FragColor=vec4(1.0,0.52,0.15,1.0)*a;",
      "}"].join("\n"),
    blending:THREE.AdditiveBlending, transparent:true, depthWrite:false

}

function buildEnv(){

  }

  }

  stP=[]; stC=[]; hdP=[]; hdC=[]; hdS=[]; hdW=[];

// ---------- population ----------
function disposeAll(){
  for(var i=0;i<entities.length;i++){
    var grp=entities[i].group;
    grp.traverse(function(o){ if(o.geometry&&o.geometry.dispose) o.geometry.dispose(); if(o.material&&o.material.dispose) o.material.dispose(); });
    scene.remove(grp);
  }
  entities=[]; lineMats=[];
  if(trailPts){ trailScene.remove(trailPts); trailMat.dispose(); trailGeo.dispose(); trailPts=null; }
}
function makeRecipe(count){
  var pond=(params.world==="pond"), city=(params.world==="city");
  var w = pond ? [["lamp",2],["ice",3],["strider",3],["orb",2],["burst",3],["pins",2]]
        : city ? [["whiteC",3],["cyanC",4],["flag",4],["dbl",3],["eye",2]]
               : [["eye",4],["cyan",4],["pink",2],["flag",5],["dbl",3]];
  var total=0,i; for(i=0;i<w.length;i++) total+=w[i][1];
  var list=[];
  for(i=0;i<w.length;i++){ var num=Math.max(1, Math.round(w[i][1]/total*count)); for(var k=0;k<num;k++) list.push(w[i][0]); }
  for(i=list.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=list[i]; list[i]=list[j]; list[j]=t; }
  while(list.length<count) list.push(pick(pond ? ["ice","strider","burst","pins"] : city ? ["cyanC","flag","dbl","whiteC"] : ["cyan","flag","eye","dbl"]));
  list.length=count; return list;
}
function build(count){
  disposeAll();
  var recipe=makeRecipe(count);
  for(var i=0;i<count;i++){
    var e={ group:new THREE.Group(), cage:null, bb:[],
            vel:new THREE.Vector3((Math.random()-0.5)*2,0,(Math.random()-0.5)*2),
            speedScale:0.6+Math.random()*0.85, rollMul:0, effR:1, colR:2, glide:false, wanderAng:Math.random()*6.28, homeY:(Math.random()*2-1)*SLAB,
            state:"move", stateT:1+Math.random()*4, band:8, bass:null,
            idx:i, head:0, count:0, lastDrop:new THREE.Vector3() };
    var type=recipe[i];
    if(type==="eye") buildEye(e);
    else if(type==="cyan") buildCube(e, PAL.cyan);
    else if(type==="pink") buildCube(e, PAL.pink);
    else if(type==="whiteC") buildCube(e, PAL.white);
    else if(type==="cyanC") buildCube(e, PAL.cyan);
    else if(type==="flag") buildFlag(e);

    var s=(0.9+Math.random()*0.55)*(city?0.67:1);      // the city cast runs small against the towers
    e.group.scale.setScalar(s); e.effR*=s; e.colR*=s; if(e.hover) e.hover*=s;
    if(city){
      var CH={whiteC:3.2, cyanC:3.2, eye:3.0, flag:2.72, dbl:1.5};
      e.trafH=(CH[type]||2.4)*s+0.18;
      e.dweller=((type==="flag"||type==="dbl") && Math.random()<0.45 && cityBlocks.length>0);
      if(e.dweller){                                   // a few keep to the turf and never join the traffic
        var db=-1, dg=0, dx3=0, dz3=0;
        while(dg++<40){

        }

        else e.dweller=false;
      }
      if(!e.dweller){                                  // the rest are traffic: an axis, a road, a lane
        e.tAxis=(Math.random()<0.5)?0:1;

        e.tRoad=(Math.random()*rds.length)|0;
        e.tDir=(Math.random()<0.5)?-1:1;
        e.tLane=e.tDir*(0.12+Math.random()*0.12)*CITY_SW;
        e.tCool=1+Math.random()*2;
        e.offroad=false; e.offT=0;
        var along=(Math.random()*2-1)*CITY_EXT*0.85;
        var perp=rds[e.tRoad]+e.tLane;
        for(var sg=0;sg<30;sg++){                // its street may be built over just there: find open tarmac
          var svx=(e.tAxis===0)?along:perp, svz=(e.tAxis===0)?perp:along;
          if(sdCity(svx,svz)>2.0) break;
          along=(Math.random()*2-1)*CITY_EXT*0.85;
        }
        if(e.tAxis===0) e.group.position.set(along, GROUND_Y+e.trafH, perp);
        else            e.group.position.set(perp, GROUND_Y+e.trafH, along);
        e.vel.set(e.tAxis===0?e.tDir*3:0, 0, e.tAxis===1?e.tDir*3:0);
      }
    } else {
      var ang=Math.random()*Math.PI*2, rad=(pond?38:ROAM)*(0.15+0.8*Math.random());
      e.group.position.set(Math.cos(ang)*rad, pond?PW_Y-1.4:e.homeY, Math.sin(ang)*rad);
    }
    e.lastDrop.copy(e.group.position);
    scene.add(e.group); entities.push(e);
  }

  // trail dots: one buffer, real circle-of-confusion bokeh in the shader
  trailGeo=new THREE.BufferGeometry();
  trailPos=new Float32Array(count*TRAIL_LEN*3);
  trailCol=new Float32Array(count*TRAIL_LEN*3);
  trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPos,3));
  trailGeo.setAttribute("color", new THREE.BufferAttribute(trailCol,3));
  trailMat=new THREE.ShaderMaterial({
    transparent:true, depthTest:true, depthWrite:false,
    uniforms:{ uFocus:{value:cam.r}, uBase:{value:params.trailSize*0.30*(params.world==="pond"?0.30:1)}, uAperture:{value:params.dof*0.012}, uProj:{value:projScale}, uMax:{value:58.0}, uT:{value:0}, uWob:{value:(params.world==="pond"?1.0:0.0)} },
    vertexShader:[
      "attribute vec3 color;",
      "uniform float uFocus,uBase,uAperture,uProj,uMax,uT,uWob;",
      "varying vec3 vColor; varying float vSoft;",
      "void main(){",
      "  vColor=color;",
      "  vec3 p=position;",
      "  float age=0.0;",
      "  if(uWob>0.5){",
      "    float lum=(vColor.r+vColor.g+vColor.b)*0.345;",
      "    age=1.0-clamp(lum,0.0,1.0);",
      "    float hh=fract(sin(dot(position.xz, vec2(12.9898,78.233)))*43758.5453)*6.2831;",
      "    float amp=0.20+age*2.2;",
      "    p.x+=sin(uT*0.9+hh)*0.28*amp; p.z+=cos(uT*0.8+hh*1.7)*0.28*amp;",
      "    p.y+=sin(uT*1.3+hh*2.3)*0.12+age*0.5;",
      "  }",
      "  vec4 mv=modelViewMatrix*vec4(p,1.0);",
      "  float vd=max(-mv.z,0.001);",
      "  float coc=abs(vd-uFocus);",
      "  float ap=uAperture; if(uWob>0.5) ap*=0.30;",                   // bubbles stay crisp like the rock foam
      "  float worldR=uBase+ap*coc;",
      "  if(uWob>0.5) worldR*=(1.0-age*0.45);",
      "  gl_PointSize=clamp(worldR*uProj/vd,1.0,uMax);",
      "  vSoft=clamp(coc/(uFocus*0.7),0.0,1.0);",
      "  if(uWob>0.5) vSoft*=0.22;",
      "  gl_Position=projectionMatrix*mv;",
      "}"
    ].join("\n"),
    fragmentShader:[
      "precision mediump float;",
      "varying vec3 vColor; varying float vSoft;",
      "void main(){",
      "  if(dot(vColor,vColor)<0.0004) discard;",
      "  vec2 uv=gl_PointCoord-0.5; float r=length(uv)*2.0;",
      "  float edge=mix(0.12,0.85,vSoft);",
      "  float a=smoothstep(1.0,1.0-edge,r);",
      "  if(a<=0.002) discard;",
      "  float bright=mix(1.0,0.62,vSoft);",
      "  gl_FragColor=vec4(vColor*bright, a);",
      "}"
    ].join("\n")
  });
  trailPts=new THREE.Points(trailGeo, trailMat); trailPts.frustumCulled=false; trailScene.add(trailPts);

  for(var wstep=0; wstep<320; wstep++){ elapsed+=1/60; step(1/60); }
  allDirty=true;
}

// ---------- planar motion field ----------
function flow(p, t, out){
  var s=0.06, a=t*0.18;
  out.x = Math.sin(p.z*s + a)         - Math.cos(p.y*s*1.3 - a*0.8);
  out.z = Math.sin(p.x*s*1.1 + a*0.9) - Math.cos(p.z*s + a*1.1);
}
function step(dt){
  var i,e,p;
  // 0. soft mid-range repulsion so they spread out and roam apart instead of clumping
  var SPREAD=24, n=entities.length, si, sj;
  for(si=0;si<n;si++){
    var sa=entities[si], spa=sa.group.position;
    for(sj=si+1;sj<n;sj++){
      var sb=entities[sj], spb=sb.group.position;
      var sdx=spa.x-spb.x, sdz=spa.z-spb.z, sd2=sdx*sdx+sdz*sdz;
      if(sd2<SPREAD*SPREAD && sd2>1e-3){
        var sd=Math.sqrt(sd2), sf=13.0*(1-sd/SPREAD)/sd*dt;
        sa.vel.x+=sdx*sf; sa.vel.z+=sdz*sf;
        sb.vel.x-=sdx*sf; sb.vel.z-=sdz*sf;
      }
    }
  }
  // 1. flow + integrate
  for(i=0;i<entities.length;i++){
    e=entities[i]; p=e.group.position;

    // start / stop: each creature drifts then rests then bursts off again
    e.stateT -= dt;
    if(e.stateT<=0){
      if(e.state==="move"){
        e.state="rest"; e.stateT=(1.2+Math.random()*3.5)/audio.density;
      }
      else {
        e.state="move"; e.stateT=(2.5+Math.random()*5.0)/audio.density;
        var burst=7+Math.random()*7;                  // kick off in its heading
        e.vel.x += Math.cos(e.wanderAng)*burst;
        e.vel.z += Math.sin(e.wanderAng)*burst;
        if(e.band<=2){ maybeChord(); }                  // cube launch -> move the harmony (pad follows)
        else onsetNote(e);                               // others -> melodic ping
      }
    }
    var thr = (e.state==="move") ? 1.0 : 0.05;          // resting = almost no self-drive

    var wmul=(params.world==="city" && !e.dweller && !e.offroad) ? 0.30 : 1;   // traffic keeps its mind on the road
    flow(p, elapsed, F);
    e.vel.x += F.x*3.5*dt*thr*wmul;
    e.vel.z += F.z*3.5*dt*thr*wmul;
    e.wanderAng += (Math.random()-0.5)*2.2*dt;      // each one drifts its own heading
    e.vel.x += Math.cos(e.wanderAng)*4.5*dt*thr*wmul;
    e.vel.z += Math.sin(e.wanderAng)*4.5*dt*thr*wmul;
    var ty=e.homeY, ks=3.0, roam=ROAM;        // field: hover in the slab
    if(params.world==="pond"){                  // pond: swim under the film, ride the sand up into the air
      var swim = PW_Y - (e.dive||1.6) + e.homeY*0.3 + Math.sin(elapsed*1.4+e.idx*2.1)*0.34;
      if(swim < PW_Y-PW_BED+0.9) swim = PW_Y-PW_BED+0.9;
      var dome = envDomeY(p.x,p.z);
      var vl2=Math.hypot(e.vel.x,e.vel.z);                     // feel the slope ahead with the body's edge
      if(vl2>0.05){
        var la=envDomeY(p.x+e.vel.x/vl2*e.colR*0.8, p.z+e.vel.z/vl2*e.colR*0.8);
        if(la>dome) dome=la;
      }
      ty = Math.max(swim, dome + (e.hover||0.8));
      ks = 4.4; roam = 42;
    }
    else if(params.world==="city"){             // city: the streets carry them — hold a lane, take the odd turn
      ks=5.2; roam=CITY_R*1.7;                  // the grid does the containing; no circular pull to fight it
      if(e.dweller){
        ty=cityTopY(p.x,p.z)+e.trafH;
        if(e.dwB>=cityBlocks.length) e.dwB=0;     // the sliders can regrow the town under their feet
        var bD=cityBlocks[e.dwB], dIn=sdRect(bD,p.x,p.z);
        if(dIn>-3.0){                             // nearing the kerb: ease back onto the turf
          var gpx=sdRect(bD,p.x+0.6,p.z)-sdRect(bD,p.x-0.6,p.z);
          var gpz=sdRect(bD,p.x,p.z+0.6)-sdRect(bD,p.x,p.z-0.6);
          var gl=Math.hypot(gpx,gpz)||1; gpx/=gl; gpz/=gl;
          var pull=(dIn+3.0)*5.5*dt;
          e.vel.x-=gpx*pull; e.vel.z-=gpz*pull;
          if(dIn>-1.2){                           // and the kerb itself is a soft wall
            var vout=e.vel.x*gpx+e.vel.z*gpz;
            if(vout>0){ e.vel.x-=gpx*vout; e.vel.z-=gpz*vout; }
          }
        }
      } else {
        ty=cityTopY(p.x,p.z)+e.trafH;           // ride the surface: kerbs on the way up, kerbs on the way home
        if(e.offroad){                          // off exploring the turf; it will find its way back
          e.offT-=dt;
          var drr=Math.hypot(p.x,p.z);
          if(drr>CITY_R*0.90){ e.vel.x-=p.x/drr*6*dt; e.vel.z-=p.z/drr*6*dt; }
          if(e.offT<=0){
            e.offroad=false;                    // the urge passes: rejoin the nearest street
            var bd=1e9, bR=0, bA=0, ri;
            for(ri=0;ri<cityZ.length;ri++){ var d0=Math.abs(p.z-cityZ[ri]); if(d0<bd){ bd=d0; bA=0; bR=ri; } }
            for(ri=0;ri<cityX.length;ri++){ var d1=Math.abs(p.x-cityX[ri]); if(d1<bd){ bd=d1; bA=1; bR=ri; } }
            e.tAxis=bA; e.tRoad=bR;
            e.tDir=(Math.random()<0.5)?-1:1;
            e.tLane=e.tDir*(0.12+Math.random()*0.12)*CITY_SW;
            e.tCool=2.0;
          }
        } else {
          var rds=(e.tAxis===0)?cityZ:cityX;
          if(e.tRoad>=rds.length) e.tRoad=rds.length-1;
          var lane=rds[e.tRoad]+e.tLane;
          if(e.tAxis===0){                      // riding an east-west street
            e.vel.z+=(lane-p.z)*4.8*dt; e.vel.z*=(1-2.6*dt);
            e.vel.x+=e.tDir*9.0*dt*thr;
          } else {                              // riding a north-south street
            e.vel.x+=(lane-p.x)*4.8*dt; e.vel.x*=(1-2.6*dt);
            e.vel.z+=e.tDir*9.0*dt*thr;
          }
          e.tCool-=dt;
          var sdHere=sdCity(p.x,p.z);
          if(sdHere>0.5 && Math.random()<0.016*dt){   // now and then the turf calls, and one wanders off the road
            e.offroad=true; e.offT=5+Math.random()*8;
            sdCityGrad(p.x,p.z,F);
            e.vel.x-=F.x*5; e.vel.z-=F.z*5;     // a shove up over the kerb
          }
          if(!e.offroad && sdHere>-0.5){        // road sense only applies while actually on the road
            // sniff the tarmac ahead: the town may have grown over this street
            var lookA=CITY_SW*0.95+e.colR;
            var bax=p.x+(e.tAxis===0?e.tDir*lookA:0), baz=p.z+(e.tAxis===1?e.tDir*lookA:0);
            var blockedAhead=(sdCity(bax,baz)<2.0);
            if(e.tCool<=0 || blockedAhead){     // a junction: signal one way or the other and go
              var cross=(e.tAxis===0)?cityX:cityZ;
              var along0=(e.tAxis===0)?p.x:p.z;
              for(var ci=0;ci<cross.length;ci++){
                if(Math.abs(along0-cross[ci])<CITY_SW*0.5){
                  if(Math.random()<0.55 || blockedAhead){   // a wall ahead makes the turn compulsory
                    e.tAxis=1-e.tAxis; e.tRoad=ci;
                    var na=(e.tAxis===0)?p.x:p.z;   // heading out of town? turn back toward the middle
                    e.tDir=(Math.abs(na)>CITY_EXT*0.4)?(na>0?-1:1):((Math.random()<0.5)?-1:1);
                    var wax=(e.tAxis===0)?p.x+e.tDir*CITY_SW*0.9:p.x;   // and don't turn straight into another wall
                    var waz=(e.tAxis===1)?p.z+e.tDir*CITY_SW*0.9:p.z;
                    if(sdCity(wax,waz)<2.0) e.tDir*=-1;
                    e.tLane=e.tDir*(0.12+Math.random()*0.12)*CITY_SW;
                    e.tCool=2.4+Math.random();

                }

            }
            if(blockedAhead){                   // no junction offered itself: turn back at the wall
              var nbx=p.x+(e.tAxis===0?e.tDir*CITY_SW*0.5:0), nbz=p.z+(e.tAxis===1?e.tDir*CITY_SW*0.5:0);
              if(sdCity(nbx,nbz)<2.0){
                e.tDir*=-1;
                e.tLane=e.tDir*(0.12+Math.random()*0.12)*CITY_SW;
                e.tCool=1.0;
              }
            }
            var alongC=(e.tAxis===0)?p.x:p.z;   // the edge of town: swing round and head back
            if(alongC*e.tDir>CITY_EXT){
              e.tDir*=-1;
              e.tLane=e.tDir*(0.12+Math.random()*0.12)*CITY_SW;
              e.tCool=1.2;
            }
            if(Math.abs(alongC)>CITY_R*0.96){   // and a hard kerbstone at the very end of the road
              if(e.tAxis===0){ p.x=(p.x>0?1:-1)*CITY_R*0.96; e.vel.x*=-0.3; }
              else           { p.z=(p.z>0?1:-1)*CITY_R*0.96; e.vel.z*=-0.3; }
            }
          }
          if(!e.offroad){                       // never up onto the kerb uninvited
            var sdc=sdHere, mg=0.7+e.colR*0.35;
            if(sdc<mg){
              sdCityGrad(p.x,p.z,F);
              p.x+=F.x*(mg-sdc)*0.55; p.z+=F.z*(mg-sdc)*0.55;
              var vdc=e.vel.x*F.x+e.vel.z*F.z;
              if(vdc<0){ e.vel.x-=F.x*vdc*1.5; e.vel.z-=F.z*vdc*1.5; }
            }
          }
        }
      }
    }
    e.vel.y += (ty - p.y)*ks*dt;
    e.vel.y *= (1 - 2.2*dt);                  // damp vertical drift
    if(e.state==="rest"){ e.vel.x*=(1-1.8*dt); e.vel.z*=(1-1.8*dt); }  // settle to a stop

    if(params.world==="pond"){                    // riding a swell: a soft pitch-and-roll while afloat
      if(p.y < PW_Y+1.2){
        e.group.rotation.x = Math.sin(elapsed*1.05+e.idx*1.7)*0.085;
        e.group.rotation.z = Math.cos(elapsed*0.90+e.idx*2.3)*0.085;
      } else {
        e.group.rotation.x *= (1-3.0*dt);           // settle flat on the sand
        e.group.rotation.z *= (1-3.0*dt);
      }
    }
    var dr=Math.hypot(p.x,p.z);
    if(dr>roam){ var k=((dr-roam)*0.6*dt)/dr; e.vel.x-=p.x*k; e.vel.z-=p.z*k; }

    e.vel.multiplyScalar(1 - 0.6*dt);
    var mx=7*params.speed*e.speedScale, sp=e.vel.length();
    if(sp>mx){ e.vel.multiplyScalar(mx/sp); }
    p.addScaledVector(e.vel, dt);

    if(e.glide){
      sp=e.vel.length();
      if(sp>0.05){
        DIR.copy(e.vel).normalize();
        var yaw=Math.atan2(DIR.x, DIR.z);               // heading in the ground plane
        TQ.setFromAxisAngle(UP, yaw);                   // yaw only -> base stays flat, point leads
        e.cage.quaternion.slerp(TQ, 1-Math.pow(0.0015, dt));
      }
    } else if(e.cage && e.rollMul>0){
      sp=e.vel.length();
      if(sp>1e-4){
        DIR.copy(e.vel).normalize(); AX.copy(UP).cross(DIR);
        if(AX.lengthSq()<1e-5) AX.copy(RIGHT).cross(DIR);
        AX.normalize();
        DQ.setFromAxisAngle(AX, (sp*dt/e.effR)*e.rollMul);
        e.cage.quaternion.premultiply(DQ);
      }
    } else if(e.cage && e.spinY){
      e.cage.rotation.y += e.spinY*dt;          // striders slowly pirouette on the water
    }
  }
  // 2. keep them from overlapping: they bump and push apart, never interpenetrate
  separate();
  // 2b. push creatures out of rocks and trunks (2D circles on the ground plane)
  for(i=0;i<entities.length;i++){
    e=entities[i];
    for(var oi=0;oi<envObstacles.length;oi++){
      var ob=envObstacles[oi];
      var odx=e.group.position.x-ob.x, odz=e.group.position.z-ob.z;
      var rr=ob.r+e.colR*0.7, d2=odx*odx+odz*odz;
      if(d2<rr*rr && d2>1e-8){

        e.group.position.z=ob.z+nz*rr;
        var vd=e.vel.x*nx+e.vel.z*nz;
        if(vd<0){ e.vel.x-=nx*vd*1.6; e.vel.z-=nz*vd*1.6; }
      }
    }
  }
  // 3. lay down trail dots from the resolved positions (bubbles in the pond, red thread in the field)
  for(i=0;i<entities.length;i++){
    e=entities[i]; p=e.group.position;
    if(params.world==="pond" && p.y > PW_Y+1.2){ e.lastDrop.copy(p); continue; }   // no bubbles on land
    if(p.distanceTo(e.lastDrop) > SPACING){
      var base=e.idx*TRAIL_LEN, pond2=(params.world==="pond"), city2=(params.world==="city"), reps=pond2?2:1;
      for(var rp=0;rp<reps;rp++){
        var slot=base+e.head, ox=0, oz=0, dy2=p.y;
        if(pond2){
          ox=(Math.random()-0.5)*2.6; oz=(Math.random()-0.5)*2.6;                    // a loose puff, not a thread
          dy2=PW_Y+0.24+Math.random()*0.35;                                          // bubbles surface: foam sits ON the film
        }
        else if(city2){ dy2=cityTopY(p.x,p.z)+0.55; }                                // the thread lies on the ground, road or turf
        trailPos[slot*3]=p.x+ox; trailPos[slot*3+1]=dy2; trailPos[slot*3+2]=p.z+oz;
        e.head=(e.head+1)%TRAIL_LEN; if(e.count<TRAIL_LEN) e.count++;

      recolor(e); e.lastDrop.copy(p);
    }
  }
}
function separate(){
  var n=entities.length, iter, i, j;
  for(iter=0; iter<2; iter++){
   for(i=0;i<n;i++){
    var a=entities[i], pa=a.group.position;
    for(j=i+1;j<n;j++){
      var b=entities[j], pb=b.group.position;
      var dx=pa.x-pb.x, dy=pa.y-pb.y, dz=pa.z-pb.z;
      var d2=dx*dx+dy*dy+dz*dz, minD=a.colR+b.colR;
      if(d2<minD*minD && d2>1e-6){
        var d=Math.sqrt(d2), inv=1/d, ov=(minD-d)*0.5;
        var nx=dx*inv, ny=dy*inv, nz=dz*inv;
        pa.x+=nx*ov; pa.y+=ny*ov; pa.z+=nz*ov;     // push apart so they never overlap
        pb.x-=nx*ov; pb.y-=ny*ov; pb.z-=nz*ov;
        if(iter===0){
          var rvn=(a.vel.x-b.vel.x)*nx+(a.vel.y-b.vel.y)*ny+(a.vel.z-b.vel.z)*nz;
          if(rvn<0){                                // approaching -> bounce off each other
            var jimp=-0.75*rvn;
            a.vel.x+=nx*jimp; a.vel.y+=ny*jimp; a.vel.z+=nz*jimp;
            b.vel.x-=nx*jimp; b.vel.y-=ny*jimp; b.vel.z-=nz*jimp;
            if(rvn<-3) bounceNote(-rvn);
          }
        }

    }

  }
}
function recolor(e){
  var base=e.idx*TRAIL_LEN;

  var denom=Math.max(1, Math.min(vis,cnt)-1);

    var slot=base+((e.head-1-k+TRAIL_LEN)%TRAIL_LEN);
    var r=0,g=0,b=0;
    if(k<cnt && k<vis){
      var f=k/denom;
      if(params.world==="pond"){                                        // a bubble wake: pure white, thinning away
        var fd=1-f*0.80;
        r=fd; g=fd; b=fd;
      } else {
        var br=1-f*0.72, RC=(params.world==="city")?CITY_RED:RED;
        r=RC[0]*br; g=RC[1]*br; b=RC[2]*br;

}

// ---------- per-frame: billboards face camera ----------
function updateLook(){
  var qx=camera.quaternion;
  for(var i=0;i<entities.length;i++){ var e=entities[i]; for(var b=0;b<e.bb.length;b++) e.bb[b].quaternion.copy(qx); }
}
function updateCamera(dt){
  if(autoOrbit && (elapsed-lastInteract)>4) cam.theta += 0.035*dt;
  var ph=Math.min(Math.max(cam.phi,0.0001),Math.PI-0.0001), r=cam.r;
  camera.position.set(
    target.x + r*Math.sin(ph)*Math.cos(cam.theta),
    target.y + r*Math.cos(ph),
    target.z + r*Math.sin(ph)*Math.sin(cam.theta)
  );

  // so blend 'up' toward a horizontal reference for a clean plan view straight down
  var c=Math.cos(ph);
  var t=Math.min(Math.max((Math.abs(c)-0.9)/0.1,0),1);
  camera.up.set(Math.cos(cam.theta)*t, 1-t, Math.sin(cam.theta)*t).normalize();
}

// ---------- ambient audio: the field scores itself ----------
// ---------- harmony + voices (ported from Chord Field) ----------
var MODES     = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10] };
var CHORD_DEG = { major:['Maj','min','min','Maj','Maj','min','dim'], minor:['min','dim','Maj','min','min','Maj','Maj'] };
var COL_MAJ   = { triad:[0,4,7], add9:[0,4,7,14] };
var COL_MIN   = { triad:[0,3,7], add9:[0,3,7,14] };
var PROG_TMPL = [[0,3,4,0],[0,5,3,4],[0,5,1,4],[0,2,5,4],[0,4,5,3],[0,3,5,4]];
var PROG_POND = [[0,4,3,0],[0,3,0,4],[0,4,5,4],[0,3,4,5]];   // bouncy I-IV-V shapes, skipping the diminished degree
var PROG_CITY = [[0,3,4,3],[0,3,0,4],[0,4,3,0],[0,3,4,0]];   // I, IV and V only: nothing minor under the bells

var audio = { on:false, ctx:null, master:null, wet:null, dry:null, conv:null, padBus:null, pingBus:null,
              lastPing:0, lastBounce:0, lastChord:0,
              masterVol:0.259, space:0.17, padLevel:1.46, density:0.66, tail:0.62, tone:0.47, padOct:0,
              atk:0.079, dec:1.80, sus:0.30, rel:1.69, bassTone:200, chordGap:11,
              key:2, mode:'major', colour:'triad', prog:[0,3,4,0], step:0, loopCount:0, modFreq:2, bOct:5,
              flavour:'field', worldOct:0, shimRatio:2.002, padWave:'triangle', gapMul:1,
              padOscs:[], pool:[] };

function hz(m){ return 440*Math.pow(2,(m-69)/12); }
function clamp01(x){ return x<0?0:(x>1?1:x); }

function chordType(deg){ return CHORD_DEG[audio.mode][deg%7]; }
function chordIvs(deg){ var t=chordType(deg), mn=(t==='min'||t==='dim'); return mn?COL_MIN[audio.colour]:COL_MAJ[audio.colour]; }
function chordRootSemi(deg){ return (audio.key + MODES[audio.mode][deg%7])%12; }
function padBaseOct(){ return 2 + Math.round(audio.padOct/12) + (audio.worldOct||0); }   // bass-oct shifts the pad register; the pond sits deeper

function getChordMidis(deg){      // voiced pad chord (third & fifth lifted an octave -> open spread)
  var rs=chordRootSemi(deg), ivs=chordIvs(deg), oc=padBaseOct(), out=[];
  for(var i=0;i<ivs.length;i++){
    var o=oc;
    if(i===ivs.length-1 && ivs.length>2) o=oc+1;
    if(i===Math.floor(ivs.length/2) && ivs.length>2) o=oc+1;
    out.push(60 + rs + ivs[i] + (o-4)*12);

}
function buildPool(deg){          // exact chord tones (like the original 'chord notes' mode), two octaves
  var rs=chordRootSemi(deg), ivs=chordIvs(deg), pool=[];
  for(var oc=0; oc<2; oc++){ for(var j=0;j<ivs.length;j++){ pool.push(60 + rs + ivs[j] + (audio.bOct-4+oc)*12); } }

// ---- Voice A: ADSR pad, triangle body + a quiet octave-up sine shimmer, one filter per note ----
function playPadNote(midis, soft){
  if(!audio.ctx) return;
  var ctx=audio.ctx, now=ctx.currentTime;
  var vol=(soft?0.5:1), sus=audio.sus, a=audio.atk, d=audio.dec, r=audio.rel, n=midis.length, fresh=[];
  for(var i=0;i<n;i++){
    var filt=ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=audio.bassTone; filt.Q.value=0.4; filt.connect(audio.padBus);
    var off=i*0.02;

    o1.type=audio.padWave; o1.frequency.value=hz(midis[i]);
    var peak=vol*0.30/n, susL=peak*sus;
    g1.gain.setValueAtTime(0, now);
    g1.gain.linearRampToValueAtTime(peak, now+a+off);
    g1.gain.linearRampToValueAtTime(susL, now+a+d+off);
    g1.gain.setTargetAtTime(0, now+a+d+0.05, r*0.9);
    o1.connect(g1); g1.connect(filt); o1.start(now+off); fresh.push(o1,g1);
    var o2=ctx.createOscillator(), g2=ctx.createGain();
    o2.type="sine"; o2.frequency.value=hz(midis[i])*audio.shimRatio;        // field: octave shimmer / pond: a watery fifth
    var peak2=vol*0.10/n, sus2=peak2*sus;
    g2.gain.setValueAtTime(0, now);
    g2.gain.linearRampToValueAtTime(peak2, now+a+0.03+off);
    g2.gain.linearRampToValueAtTime(sus2, now+a+d+0.03+off);
    g2.gain.setTargetAtTime(0, now+a+d+0.08, r*1.1);
    o2.connect(g2); g2.connect(filt); o2.start(now+off); fresh.push(o2,g2);

function releaseOld(list){        // gentle fade + stop of the previous chord (soft handoff, no glide)
  if(!audio.ctx||!list.length) return;
  var now=audio.ctx.currentTime, rel=Math.max(0.4, audio.rel*0.8);
  for(var i=0;i<list.length;i++){ var nd=list[i];
    if(nd.gain){ try{ nd.gain.cancelScheduledValues(now); nd.gain.setTargetAtTime(0, now, rel*0.5); }catch(e){} }
    else if(nd.frequency){ (function(osc){ setTimeout(function(){ try{osc.stop();}catch(e){} }, (rel+0.6)*1000); })(nd); }
  }
}
function playPad(deg, soft){
  if(!audio.ctx) return;
  releaseOld(audio.padOscs); audio.padOscs=[];
  playPadNote(getChordMidis(deg), soft);
}

// ---- Voice B: plucky melodic ping, locked to the current chord's tones ----
function ping(midi, pan, amt){
  if(!audio.on||!audio.ctx) return;
  var ctx=audio.ctx, now=ctx.currentTime;
  if(now-audio.lastPing < 0.12/audio.density) return;            // density gate
  audio.lastPing=now;
  var dest=audio.pingBus, pn=null;
  if(ctx.createStereoPanner){ pn=ctx.createStereoPanner(); pn.pan.value=Math.max(-1,Math.min(1,pan)); pn.connect(audio.pingBus); dest=pn; }
  var pond=(audio.flavour==='pond'), citysnd=(audio.flavour==='city');
  var f=ctx.createBiquadFilter(); f.type="lowpass"; f.Q.value=0; f.connect(dest);
  var durS=pond ? Math.max(0.30, audio.tail*0.55) : (citysnd ? Math.max(0.5, audio.tail*1.5) : Math.max(0.03, audio.tail*0.1));   // strings and bells ring longer
  var peak=(0.45+amt*0.55)*0.32;

    f.frequency.setValueAtTime(1400+audio.tone*4200, now);
    f.frequency.exponentialRampToValueAtTime(500, now+durS*0.7);
  } else if(citysnd){
    // a small resonator bell: hard little strike, long sweet ring.
    // mostly-harmonic partials keep it musical; the 5.43 gives just a breath of metal.
    f.frequency.value=1500+audio.tone*4500; f.Q.value=0.7;
    var base=hz(midi);
    var PART=[[1.0,1.0,1.0],[2.0,0.42,0.55],[3.01,0.18,0.38],[5.43,0.20,0.12]];  // ratio, level, share of the ring
    for(var pi=0;pi<PART.length;pi++){
      var po=ctx.createOscillator(), pg=ctx.createGain();
      po.type="sine"; po.frequency.value=base*PART[pi][0];
      pg.gain.setValueAtTime(0, now);
      pg.gain.linearRampToValueAtTime(peak*PART[pi][1]*0.9, now+0.004);
      pg.gain.exponentialRampToValueAtTime(0.0008, now+Math.max(0.06, durS*PART[pi][2]));
      po.connect(pg); pg.connect(f);
      po.start(now); po.stop(now+durS*PART[pi][2]+0.1);

  var o=ctx.createOscillator(), g=ctx.createGain();
  if(pond){
    o.type="triangle";                                                   // string body, not a pure tone
    o.frequency.setValueAtTime(hz(midi)*1.015, now);                     // settles onto its pitch
    o.frequency.exponentialRampToValueAtTime(hz(midi), now+0.03);
  } else { o.type="sine"; o.frequency.value=hz(midi); }

  g.gain.linearRampToValueAtTime(peak, now+0.006);                       // 6ms attack
  g.gain.exponentialRampToValueAtTime(0.001, now+durS);                  // exponential decay
  o.connect(g); g.connect(f); o.start(now); o.stop(now+durS+0.08);

    var o2=ctx.createOscillator(), g2=ctx.createGain();
    o2.type="sine"; o2.frequency.value=hz(midi)*2.004;
    g2.gain.setValueAtTime(0, now);
    g2.gain.linearRampToValueAtTime(peak*0.35, now+0.005);
    g2.gain.exponentialRampToValueAtTime(0.001, now+durS*0.45);
    o2.connect(g2); g2.connect(f); o2.start(now); o2.stop(now+durS*0.5+0.08);

}
function poolNote(frac){ var p=audio.pool; if(!p||!p.length) return 72; return p[Math.floor(clamp01(frac)*(p.length-1))]; }
function onsetNote(e){

function bounceNote(strength){
  if(!audio.on||!audio.ctx) return;
  var now=audio.ctx.currentTime;
  if(now-audio.lastBounce<0.5) return; audio.lastBounce=now;
  if(Math.random()<0.4){ var p=audio.pool; if(p&&p.length) ping(p[Math.floor(Math.random()*p.length)], (Math.random()*2-1)*0.5, 0.14); }

// ---- progression stepping + occasional circle-of-fifths modulation ----
function setChord(deg, soft){ playPad(deg, soft); buildPool(deg); }
function advStep(){               // weighted random step: favours nearby degrees, avoids repeating
  var prev=audio.step, prog=audio.prog;
  var w=prog.map(function(_,i){ return i===prev?0.05:1/(Math.abs(prog[i]-prog[prev])+1); });
  var tot=w.reduce(function(a,b){return a+b;},0), r=Math.random()*tot, s=0;
  for(var i=0;i<w.length;i++){ r-=w[i]; if(r<=0){ s=i; break; } }
  audio.step=s;
  if(s===0){ audio.loopCount++; if(audio.modFreq>0 && audio.loopCount%audio.modFreq===0){ audio.key=(audio.key+7)%12; } } // up a fifth, occasionally
  setChord(prog[audio.step], false);
}
function maybeChord(){            // cubes launching advance the progression, paced by chord rate
  if(!audio.ctx) return;
  var now=audio.ctx.currentTime;
  if(now-audio.lastChord >= audio.chordGap*(audio.gapMul||1)){ advStep(); audio.lastChord=now; }
}

function applyWorldSound(skipChord){             // same engine, different waters
  if(params.world==="pond"){
    audio.mode='major'; audio.colour='add9'; audio.flavour='pond';
    audio.worldOct=1; audio.shimRatio=2.002; audio.padWave='sine';
    audio.gapMul=0.8; audio.modFreq=2; audio.bOct=6;
    audio.prog=PROG_POND[(Math.random()*PROG_POND.length)|0].slice();
  } else if(params.world==="city"){
    audio.mode='major'; audio.colour='add9'; audio.flavour='city';
    audio.worldOct=1; audio.shimRatio=3.0; audio.padWave='triangle';    // the pad floats an octave up, a glassy twelfth over it
    audio.gapMul=1.35; audio.modFreq=3; audio.bOct=4;                   // slow drifting changes, bells down low and warm
    audio.prog=PROG_CITY[(Math.random()*PROG_CITY.length)|0].slice();
  } else {
    audio.mode='major'; audio.colour='triad'; audio.flavour='field';
    audio.worldOct=0; audio.shimRatio=2.002; audio.padWave='triangle';
    audio.gapMul=1; audio.modFreq=2; audio.bOct=5;
    audio.prog=PROG_TMPL[(Math.random()*PROG_TMPL.length)|0].slice();
  }
  audio.step=0; audio.loopCount=0;
  if(!skipChord && audio.ctx && audio.on){ setChord(audio.prog[0], true); audio.lastChord=audio.ctx.currentTime; }
}
function audioInit(){
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  var ctx=new AC(); audio.ctx=ctx;
  audio.master=ctx.createGain(); audio.master.gain.value=audio.masterVol;
  audio.conv=ctx.createConvolver();
  var len=Math.floor(ctx.sampleRate*3.0), ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(var ch=0;ch<2;ch++){ var dd=ir.getChannelData(ch); for(var i=0;i<len;i++){ dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); } }
  audio.conv.buffer=ir;
  audio.wet=ctx.createGain(); audio.wet.gain.value=audio.space;
  audio.dry=ctx.createGain(); audio.dry.gain.value=0.8;
  audio.padBus=ctx.createGain(); audio.padBus.gain.value=audio.padLevel;
  audio.pingBus=ctx.createGain(); audio.pingBus.gain.value=1.0;
  audio.padBus.connect(audio.master); audio.pingBus.connect(audio.master);
  audio.master.connect(audio.dry); audio.master.connect(audio.conv); audio.conv.connect(audio.wet);
  audio.dry.connect(ctx.destination); audio.wet.connect(ctx.destination);
  audio.on=true;
  applyWorldSound(true);                          // pick the current world's palette + progression
  audio.step=0; audio.loopCount=0;
  setChord(audio.prog[0], true);                 // first chord blooms in softly
  audio.lastChord=ctx.currentTime;
  if(ctx.resume) ctx.resume();
  return true;
}
function audioFrame(dt){}

// ---------- loop ----------
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.033);
  if(!paused){ elapsed+=dt; step(dt); }
  updateCamera(dt); camera.lookAt(target); updateLook(); audioFrame(dt);
  if(allDirty){ for(var i=0;i<entities.length;i++) recolor(entities[i]); allDirty=false; }
  if(trailMat) trailMat.uniforms.uFocus.value = cam.r;
  if(envHeadMat && envHeadMat.uniforms.uT) envHeadMat.uniforms.uT.value = elapsed;
  if(trailMat && trailMat.uniforms.uT) trailMat.uniforms.uT.value = elapsed;
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;
  if(params.fisheye>0.001 && rt){
    renderer.setRenderTarget(rt);
    renderer.clear();
    if(envScene) renderer.render(envScene,camera);
    if(params.world==="pond"){
      renderer.render(scene,camera);
      if(waterScene) renderer.render(waterScene,camera); // the film over the swimmers...
      renderer.render(trailScene,camera);                // ...and the foam on top of the film
    } else {
      renderer.render(trailScene,camera);
      renderer.render(scene,camera);
    }
    renderer.setRenderTarget(null);
    fishMat.uniforms.tDiff.value=rt.texture;
    fishMat.uniforms.uStrength.value=params.fisheye*0.6;
    renderer.clear();
    renderer.render(quadScene,quadCam);
  } else {
    renderer.clear();
    if(envScene) renderer.render(envScene,camera);   // field first
    if(params.world==="pond"){
      renderer.render(scene,camera);
      if(waterScene) renderer.render(waterScene,camera); // the film over the swimmers...
      renderer.render(trailScene,camera);                // ...and the foam on top of the film
    } else {
      renderer.render(trailScene,camera);   // dots underneath
      renderer.render(scene,camera);        // wireframes on top
    }
  }
}

// ---------- init ----------
function init(){
  renderer=new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000,1);
  scene=new THREE.Scene();
  trailScene=new THREE.Scene();
  envScene=new THREE.Scene();
  waterScene=new THREE.Scene();
  renderer.autoClear=false;
  camera=new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 600);
  // fisheye: render the scene to a target, then warp it onto a fullscreen quad
  var pr0=Math.min(window.devicePixelRatio||1,2);
  var RTC = THREE.WebGLMultisampleRenderTarget || THREE.WebGLRenderTarget;
  rt=new RTC(Math.floor(window.innerWidth*pr0), Math.floor(window.innerHeight*pr0), {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter});
  fishMat=new THREE.ShaderMaterial({
    uniforms:{ tDiff:{value:null}, uStrength:{value:0.0} },
    vertexShader:"varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }",
    fragmentShader:[
      "precision mediump float;",
      "varying vec2 vUv; uniform sampler2D tDiff; uniform float uStrength;",
      "void main(){",
      "  vec2 cc=vUv-0.5;",
      "  float rn=length(cc)/0.7071;",                 // 0 at centre, 1 at the corners
      "  float k=min(uStrength,0.62);",
      "  float f=mix(1.0-k, 1.0, rn*rn);",             // barrel: centre magnified, corners fixed -> bulge
      "  vec2 uv=clamp(0.5+cc*f, 0.0, 1.0);",          // fills the frame, no black circle
      "  gl_FragColor=texture2D(tDiff, uv);",
      "}"
    ].join("\n")
  });
  quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  quadScene=new THREE.Scene();
  quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), fishMat));
  buildEnv();
  build(params.count);
  camera.fov = 50 + params.fisheye*72;   // honour the default fisheye amount on load
  resize();
  animate();
}
function updateProj(){
  var h=window.innerHeight, pr=Math.min(window.devicePixelRatio||1,2);
  projScale = (h*pr) / (2*Math.tan((camera.fov*Math.PI/180)/2));  // world-size -> framebuffer px
  if(trailMat) trailMat.uniforms.uProj.value = projScale;
  if(envHeadMat) envHeadMat.uniforms.uProj.value = projScale;
  if(envHazeMat) envHazeMat.uniforms.uProj.value = projScale;
}
function resize(){
  var w=window.innerWidth, h=window.innerHeight, pr=Math.min(window.devicePixelRatio||1,2);
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  updateProj();
  for(var i=0;i<lineMats.length;i++){ if(lineMats[i].resolution) lineMats[i].resolution.set(w,h); }
  for(var j=0;j<envLineMats.length;j++){ if(envLineMats[j].resolution) envLineMats[j].resolution.set(w,h); }
  if(rt) rt.setSize(Math.floor(w*pr), Math.floor(h*pr));
}
window.addEventListener("resize", resize);

// ---------- pointer / touch orbit + zoom ----------
var ptrs=new Map(), lastX=0, lastY=0, pinchD=0;
function pdist(){ var v=[]; ptrs.forEach(function(p){v.push(p);}); return Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y); }
cv.addEventListener("pointerdown", function(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=elapsed;
  if(ptrs.size===1){ lastX=e.clientX; lastY=e.clientY; } if(ptrs.size===2){ pinchD=pdist(); }
});
cv.addEventListener("pointermove", function(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=elapsed;
  if(ptrs.size===1){
    var dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    cam.theta -= dx*0.005; cam.phi -= dy*0.005; cam.phi=Math.min(Math.max(cam.phi,0.0001),Math.PI-0.0001);
  } else if(ptrs.size===2){
    var d=pdist(); if(pinchD>0){ cam.r*=pinchD/d; cam.r=Math.min(Math.max(cam.r,16),420); var z=document.getElementById("s_zoom"); if(z) z.value=cam.r; } pinchD=d;
  }
});
function endp(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchD=0; if(ptrs.size===1){ var v=null; ptrs.forEach(function(p){v=p;}); if(v){lastX=v.x;lastY=v.y;} } }
cv.addEventListener("pointerup", endp); cv.addEventListener("pointercancel", endp);
cv.addEventListener("wheel", function(e){ e.preventDefault(); cam.r*=(1+e.deltaY*0.0012); cam.r=Math.min(Math.max(cam.r,16),420); lastInteract=elapsed; }, {passive:false});

// ---------- ui ----------
function $(id){ return document.getElementById(id); }
$("toggle").addEventListener("click", function(){ $("panel").classList.toggle("hidden"); });
$("s_speed").addEventListener("input", function(e){ params.speed=parseFloat(e.target.value); });
$("s_tsize").addEventListener("input", function(e){ params.trailSize=parseFloat(e.target.value); if(trailMat) trailMat.uniforms.uBase.value=params.trailSize*0.30*(params.world==="pond"?0.30:1); });
$("s_tlen").addEventListener("input", function(e){ params.visibleLen=parseInt(e.target.value,10); allDirty=true; });
$("s_dof").addEventListener("input", function(e){ params.dof=parseFloat(e.target.value); if(trailMat) trailMat.uniforms.uAperture.value=params.dof*0.012; });
$("s_count").addEventListener("change", function(e){ params.count=parseInt(e.target.value,10); build(params.count); });
$("s_zoom").addEventListener("input", function(e){ cam.r=parseInt(e.target.value,10); lastInteract=elapsed; });
$("s_lw").addEventListener("input", function(e){ LINE_W=parseFloat(e.target.value); for(var i=0;i<lineMats.length;i++){ if("linewidth" in lineMats[i]) lineMats[i].linewidth=LINE_W; } for(var j=0;j<envLineMats.length;j++){ envLineMats[j].linewidth=LINE_W*(envLineMats[j].wmul||0.85); } });
$("s_fish").addEventListener("input", function(e){
  params.fisheye=parseInt(e.target.value,10)/100;
  camera.fov = 50 + params.fisheye*72;            // wide-angle lens captures much more of the field
  camera.updateProjectionMatrix(); updateProj();
});
$("s_grass").addEventListener("change", function(e){ params.grass=parseInt(e.target.value,10)/100; buildEnv(); });
$("s_flow").addEventListener("change", function(e){ params.flowers=parseInt(e.target.value,10)/100; buildEnv(); });
$("s_streets").addEventListener("change", function(e){ params.streets=parseInt(e.target.value,10); if(params.world==="city"){ buildEnv(); build(params.count); } });   // roads move: the cast re-learns its lanes
$("s_towers").addEventListener("change", function(e){ params.towers=parseInt(e.target.value,10)/100; if(params.world==="city"){ buildEnv(); build(params.count); } });
function setCityRows(){ var d=(params.world==="city")?"":"none"; $("r_streets").style.display=d; $("r_towers").style.display=d; }
setCityRows();
function setWorld(w){
  params.world=w;
  $("w_field").classList.toggle("on", w==="field");
  $("w_pond").classList.toggle("on", w==="pond");
  $("w_city").classList.toggle("on", w==="city");
  setCityRows();
  buildEnv();                                       // clicking any button grows a fresh world
  build(params.count);                              // ...with a fresh cast to live in it
  applyWorldSound();                                // ...and its own music
}
$("w_field").addEventListener("click", function(){ setWorld("field"); });
$("w_pond").addEventListener("click", function(){ setWorld("pond"); });
$("w_city").addEventListener("click", function(){ setWorld("city"); });
$("w_shake").addEventListener("click", function(){
  var b=this; b.classList.add("go");
  setTimeout(function(){ b.classList.remove("go"); }, 500);
  buildEnv(); build(params.count);
});
$("snd_vol").addEventListener("input", function(e){ audio.masterVol=parseInt(e.target.value,10)/100*0.7; if(audio.master) audio.master.gain.value=audio.masterVol; });
$("snd_rev").addEventListener("input", function(e){ audio.space=parseInt(e.target.value,10)/100; if(audio.wet) audio.wet.gain.value=audio.space; });
$("snd_pad").addEventListener("input", function(e){ audio.padLevel=parseInt(e.target.value,10)/100; if(audio.padBus) audio.padBus.gain.value=audio.padLevel; });
$("snd_oct").addEventListener("input", function(e){ audio.padOct=parseInt(e.target.value,10); });
$("snd_btone").addEventListener("input", function(e){ audio.bassTone=parseInt(e.target.value,10); });
$("snd_atk").addEventListener("input", function(e){ audio.atk=parseInt(e.target.value,10)/1000; });
$("snd_decay").addEventListener("input", function(e){ audio.dec=parseInt(e.target.value,10)/100; });
$("snd_sus").addEventListener("input", function(e){ audio.sus=parseInt(e.target.value,10)/100; });
$("snd_rel").addEventListener("input", function(e){ audio.rel=parseInt(e.target.value,10)/100; });
$("snd_den").addEventListener("input", function(e){ audio.density=parseInt(e.target.value,10)/100; });
$("snd_tail").addEventListener("input", function(e){ audio.tail=parseInt(e.target.value,10)/100; });
$("snd_tone").addEventListener("input", function(e){ audio.tone=parseInt(e.target.value,10)/100; });
$("snd_chord").addEventListener("input", function(e){ audio.chordGap=parseInt(e.target.value,10); });
$("b_orbit").addEventListener("click", function(){ autoOrbit=!autoOrbit; this.classList.toggle("on",autoOrbit); });
$("b_pause").addEventListener("click", function(){ paused=!paused; this.classList.toggle("on",paused); this.textContent=paused?"play":"pause"; });
$("b_regen").addEventListener("click", function(){ buildEnv(); build(params.count); });
function setSoundVisual(on){ var b=$("b_sound"); if(!b) return; b.classList.toggle("on",!!on); b.textContent=on?"sound on":"sound"; }
audio.want=true;                                  // sound on by default
function autoStart(){ if(audio.want && !audio.ctx){ if(audioInit()) setSoundVisual(true); } }
cv.addEventListener("pointerdown", autoStart);    // first touch on the field starts audio
cv.addEventListener("touchstart", autoStart, {passive:true});
window.addEventListener("keydown", autoStart);
$("b_sound").addEventListener("click", function(){
  if(!audio.ctx){ if(audioInit()){ audio.want=true; setSoundVisual(true); } }       // this click is a valid gesture
  else if(audio.on){ audio.on=false; audio.want=false; if(audio.ctx.suspend) audio.ctx.suspend(); setSoundVisual(false); }
  else { audio.on=true; audio.want=true; if(audio.ctx.resume) audio.ctx.resume(); setSoundVisual(true); }
});
window.addEventListener("keydown", function(e){ if(e.key==="h"||e.key==="H"){ $("ui").classList.toggle("gone"); $("hint").classList.add("fade"); } });
setTimeout(function(){ $("hint").classList.add("fade"); }, 5200);

try { init(); } catch(err){ console.error(err); $("err").style.display="flex"; }
})();
</script>
</body>
