<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mur Mur</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;color:#5b6f6c;font:11px ui-monospace,monospace;z-index:20;transition:opacity 1.2s;pointer-events:none}
  #hint.fade{opacity:0}
  #ui{position:fixed;left:12px;bottom:12px;z-index:20;color:#8fa3a0;font:11px/1.4 ui-monospace,Menlo,monospace;user-select:none}
  #ui.gone{display:none}
  #worldbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:30}
  #worldbar button{width:52px;height:52px;border-radius:15px;border:1px solid rgba(255,255,255,0.08);background:rgba(214,212,202,0.10);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:0.62;transition:opacity .25s, background .25s, border-color .25s}
  #worldbar button:hover{background:rgba(214,212,202,0.18);opacity:0.85}
  #worldbar button.on{background:rgba(214,212,202,0.20);border-color:rgba(255,255,255,0.26);opacity:1}
  #worldbar svg{display:block}
  #worldbar button:active{transform:scale(0.92)}
  @keyframes wshake{0%{transform:rotate(0)}25%{transform:rotate(-9deg)}55%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
  #w_shake.go svg{animation:wshake .45s ease}
  #toggle,.tg,#b_regen{background:rgba(18,26,25,.72);color:#cfe6e1;border:1px solid rgba(120,160,155,.25);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;line-height:1}
  #toggle:hover,.tg:hover,#b_regen:hover{border-color:rgba(120,160,155,.5)}
  #panel{margin-top:8px;background:rgba(8,12,12,.74);border:1px solid rgba(120,160,155,.18);border-radius:14px;padding:11px 13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:220px}
  #panel.hidden{display:none}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label{width:84px;color:#7f9b97}
  input[type=range]{flex:1;accent-color:#16e6d0;height:2px;background:transparent}
  .btnrow{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .tg.on{color:#06100f;background:#16e6d0;border-color:#16e6d0}
  .snddiv{margin:12px 0 4px;padding-top:9px;border-top:1px solid rgba(120,160,155,.18);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5f7d79}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ff6b6b;font:13px ui-monospace,monospace;text-align:center;padding:30px;z-index:30}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to orbit &nbsp;·&nbsp; scroll / pinch to zoom &nbsp;·&nbsp; press H to hide</div>
<div id="worldbar">
  <button id="w_field" title="field">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="#8aa356" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8.2" r="4.6"/><circle cx="8.1" cy="11.8" r="3.7"/><circle cx="15.9" cy="11.8" r="3.7"/><circle cx="12" cy="12.2" r="4.2"/>
      <path d="M10.6 14.5 L13.4 14.5 L12 18.6 Z"/>
    </svg>
  </button>
  <button id="w_pond" title="pond">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="#7d9bf0" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="10.6" r="6.4"/><circle cx="8.7" cy="14.3" r="3.5"/><circle cx="15.3" cy="14.3" r="3.5"/>
    </svg>
  </button>
  <button id="w_city" class="on" title="city block">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="#e6a03d" xmlns="http://www.w3.org/2000/svg">
      <polygon points="9.09,4.98 14.91,4.98 19.02,9.09 19.02,14.91 14.91,19.02 9.09,19.02 4.98,14.91 4.98,9.09"/>
    </svg>
  </button>
  <button id="w_shake" title="shake up a new world">
    <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <rect x="8.6" y="8.0" width="7.4" height="7.4" rx="1.7" fill="#d9cfb4" transform="rotate(-16 12.3 11.7)"/>
      <path d="M6.7 8.4 Q4.9 12 6.7 15.6" stroke="#d9cfb4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M4.1 7.3 Q1.9 12 4.1 16.7" stroke="#d9cfb4" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
      <path d="M17.3 8.4 Q19.1 12 17.3 15.6" stroke="#d9cfb4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M19.9 7.3 Q22.1 12 19.9 16.7" stroke="#d9cfb4" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    </svg>
  </button>
</div>
<div id="ui">
  <button id="toggle">controls</button>
  <div id="panel" class="hidden">
    <div class="row"><label>speed</label><input id="s_speed" type="range" min="0.2" max="2.5" step="0.05" value="1.8"></div>
    <div class="row"><label>dot size</label><input id="s_tsize" type="range" min="0.4" max="4" step="0.1" value="3.4"></div>
    <div class="row"><label>trail length</label><input id="s_tlen" type="range" min="20" max="120" step="1" value="34"></div>
    <div class="row"><label>focus blur</label><input id="s_dof" type="range" min="0" max="1.8" step="0.05" value="0.2"></div>
    <div class="row"><label>population</label><input id="s_count" type="range" min="6" max="34" step="1" value="15"></div>
    <div class="row"><label>line width</label><input id="s_lw" type="range" min="1" max="8" step="0.1" value="1.7"></div>
    <div class="row"><label>fisheye</label><input id="s_fish" type="range" min="0" max="100" step="1" value="57"></div>
    <div class="row"><label>zoom</label><input id="s_zoom" type="range" min="20" max="420" step="1" value="150"></div>
    <div class="snddiv">environment</div>
    <div class="row"><label>grass</label><input id="s_grass" type="range" min="10" max="150" step="5" value="100"></div>
    <div class="row"><label>flowers</label><input id="s_flow" type="range" min="10" max="200" step="5" value="100"></div>
    <div class="row" id="r_streets"><label>streets</label><input id="s_streets" type="range" min="1" max="4" step="1" value="2"></div>
    <div class="row" id="r_towers"><label>towers</label><input id="s_towers" type="range" min="0" max="200" step="5" value="100"></div>
    <div class="snddiv">sound</div>
    <div class="row"><label>volume</label><input id="snd_vol" type="range" min="0" max="100" step="1" value="37"></div>
    <div class="row"><label>reverb</label><input id="snd_rev" type="range" min="0" max="100" step="1" value="17"></div>
    <div class="row"><label>bass level</label><input id="snd_pad" type="range" min="0" max="160" step="1" value="146"></div>
    <div class="row"><label>bass oct</label><input id="snd_oct" type="range" min="-12" max="12" step="12" value="0"></div>
    <div class="row"><label>bass tone</label><input id="snd_btone" type="range" min="120" max="2400" step="10" value="200"></div>
    <div class="row"><label>attack</label><input id="snd_atk" type="range" min="1" max="200" step="1" value="79"></div>
    <div class="row"><label>decay</label><input id="snd_decay" type="range" min="2" max="300" step="1" value="180"></div>
    <div class="row"><label>sustain</label><input id="snd_sus" type="range" min="0" max="100" step="1" value="30"></div>
    <div class="row"><label>release</label><input id="snd_rel" type="range" min="5" max="500" step="1" value="169"></div>
    <div class="row"><label>note density</label><input id="snd_den" type="range" min="25" max="280" step="1" value="66"></div>
    <div class="row"><label>note length</label><input id="snd_tail" type="range" min="30" max="260" step="1" value="62"></div>
    <div class="row"><label>tone</label><input id="snd_tone" type="range" min="30" max="200" step="1" value="47"></div>
    <div class="row"><label>chord rate</label><input id="snd_chord" type="range" min="2" max="20" step="1" value="11"></div>
    <div class="btnrow">
      <button id="b_sound" class="tg on">sound on</button>
      <button id="b_orbit" class="tg on">auto-orbit</button>
      <button id="b_pause" class="tg">pause</button>
      <button id="b_regen">regenerate</button>
    </div>
  </div>
</div>
<div id="err">WebGL could not start in this view. Try opening the artifact in a browser tab.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- fat-line addons (uniform screen-space line width). thin-line fallback if these fail. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>
<script>
(function(){
"use strict";
if(typeof THREE==="undefined"){document.getElementById("err").style.display="flex";return;}

var FAT = (typeof THREE.LineMaterial!=="undefined" && typeof THREE.LineSegmentsGeometry!=="undefined" && typeof THREE.LineSegments2!=="undefined");
var LINE_W = 1.7;

// ---------- palette ----------
var PAL = {
  white:0xeef2ff, cyan:0x10e6cf, pink:0xff5fb0, magenta:0xff1f8f,
  cyanEye:0x16f0d8, orange:0xff7a14, cyanSat:0x35e6d2, yellow:0xffe21a,
  blue:0x2b48ff, bond:0xffb15a
};
var RED = [1.0, 0.12, 0.09];

// ---------- config ----------
var TRAIL_LEN = 120;
var SPACING   = 1.8;   // world gap between dots
var ROAM      = 44;    // planar radius (x,z)
var SLAB      = 2.2;   // vertical half-thickness of the plane
var params = { speed:1.8, trailSize:3.4, visibleLen:34, dof:0.20, count:15, fisheye:0.57, grass:1, flowers:1, streets:2, towers:1, world:"city" };

// ---------- state ----------
var cv = document.getElementById("c");
var renderer, scene, trailScene, camera, discTex;
var rt=null, quadScene=null, quadCam=null, fishMat=null;
var entities = [];
var envScene = null, envObstacles = [];
var trailGeo, trailPts, trailMat, trailPos, trailCol;
var target = new THREE.Vector3(0,0,0);
var cam = { r:150, theta:0.62, phi:1.14 };  // low oblique, looking across the block; drag to tilt
var clock = new THREE.Clock();
var elapsed = 0, paused = false, autoOrbit = true, lastInteract = -999, allDirty = false;
var projScale = 1000;
var lineMats = [];

// scratch
var F = new THREE.Vector3(), DIR = new THREE.Vector3(), AX = new THREE.Vector3();
var DQ = new THREE.Quaternion(), TQ = new THREE.Quaternion();
var UP = new THREE.Vector3(0,1,0), RIGHT = new THREE.Vector3(1,0,0);

// ---------- helpers ----------
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function solid(color){ return new THREE.MeshBasicMaterial({color:color}); }

function lineMat(color){
  if(!FAT) return new THREE.LineBasicMaterial({color:color});
  var lm=new THREE.LineMaterial({color:color, linewidth:LINE_W});
  if(lm.resolution) lm.resolution.set(window.innerWidth, window.innerHeight);
  lineMats.push(lm); return lm;
}
function fatSegments(pairs, color){
  if(!FAT){ var bg=new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pairs),3)); return new THREE.LineSegments(bg, lineMat(color)); }
  var lg=new THREE.LineSegmentsGeometry(); lg.setPositions(pairs);
  var seg=new THREE.LineSegments2(lg, lineMat(color)); if(seg.computeLineDistances) seg.computeLineDistances(); return seg;
}
function fatLoop(pts, color){
  if(!FAT){ var arr=[]; for(var j=0;j<pts.length;j++){ var a=pts[j], b=pts[(j+1)%pts.length]; arr.push(a.x,a.y,a.z,b.x,b.y,b.z); } var bg=new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(arr),3)); return new THREE.LineSegments(bg, lineMat(color)); }
  var flat=[]; for(var i=0;i<pts.length;i++){ flat.push(pts[i].x,pts[i].y,pts[i].z); } flat.push(pts[0].x,pts[0].y,pts[0].z);
  var lg=new THREE.LineGeometry(); lg.setPositions(flat);
  var l=new THREE.Line2(lg, lineMat(color)); if(l.computeLineDistances) l.computeLineDistances(); return l;
}
function circlePts(radius, seg){ var a=[]; for(var i=0;i<seg;i++){ var t=i/seg*Math.PI*2; a.push(new THREE.Vector3(Math.cos(t)*radius, Math.sin(t)*radius, 0)); } return a; }
function edgePairs(geo){ var eg=new THREE.EdgesGeometry(geo); var pos=eg.attributes.position.array; var out=new Array(pos.length); for(var i=0;i<pos.length;i++) out[i]=pos[i]; eg.dispose(); geo.dispose(); return out; }
function wedgePairs(sc){
  sc=sc||1;
  var L=5.2, w=2.2, b=1.6, yb=-0.7, yt=0.8;   // L: length to leading point (+Z), w: half-width, flat in Y
  function v(x,y,z){ return [x*sc,y*sc,z*sc]; }
  var a0=v(0,yb,L), b0=v(-w,yb,-b), c0=v(w,yb,-b);          // base triangle, flat, point at +Z
  var a1=v(0,yt,L*0.45), b1=v(-w*0.5,yt,-b), c1=v(w*0.5,yt,-b); // smaller top ridge -> wedge taper
  function s(p,q){ return [p[0],p[1],p[2],q[0],q[1],q[2]]; }
  return [].concat(
    s(a0,b0),s(b0,c0),s(c0,a0),          // base outline
    s(a1,b1),s(b1,c1),s(c1,a1),          // top ridge
    s(a0,a1),s(b0,b1),s(c0,c1)           // sloping struts
  );
}
function triangleMesh(s, color){
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array([0,s,0, -s*0.86,-s*0.5,0, s*0.86,-s*0.5,0]),3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:color, side:THREE.DoubleSide}));
}
function triangleOutline(s, color){
  return fatLoop([ new THREE.Vector3(0,s,0), new THREE.Vector3(-s*0.86,-s*0.5,0), new THREE.Vector3(s*0.86,-s*0.5,0) ], color);
}

// ---------- molecule ----------
function buildMolecule(e, sc){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.6*sc,16,12), solid(PAL.orange)));
  var dirs=[ new THREE.Vector3(1,0.5,0.3), new THREE.Vector3(-0.8,-0.4,0.6), new THREE.Vector3(0.25,-0.95,-0.55), new THREE.Vector3(0.7,0.6,-0.7) ];
  var cols=[PAL.orange,PAL.magenta,PAL.white,PAL.cyanSat];
  var n=3+(Math.random()<0.5?1:0), bonds=[];
  for(var i=0;i<n;i++){
    var d=dirs[i].clone().normalize().multiplyScalar((1.5+Math.random()*0.45)*sc);
    var col=cols[(i+((Math.random()*cols.length)|0))%cols.length];
    var ball=new THREE.Mesh(new THREE.SphereGeometry((0.3+Math.random()*0.12)*sc,12,10), solid(col)); ball.position.copy(d); g.add(ball);
    bonds.push(0,0,0, d.x,d.y,d.z);
  }
  g.add(fatSegments(bonds, PAL.bond));
  return g;
}

// ---------- creatures ----------
function buildEye(e){
  var cage=new THREE.Group();
  var isWedge = (Math.random()<0.55);
  var pairs = isWedge ? wedgePairs(1.15) : edgePairs(new THREE.TetrahedronGeometry(3.6));
  cage.add(fatSegments(pairs, PAL.white));
  e.group.add(cage); e.cage=cage; e.effR=6; e.colR=3.9; e.band=7;
  e.glide = isWedge;                 // wedges glide, apex leading
  e.rollMul = isWedge ? 0 : 0.3;     // tetras keep a slow tumble
  var inner=new THREE.Group(); e.group.add(inner);
  var disc=new THREE.Mesh(new THREE.CircleGeometry(1.0,28), solid(PAL.magenta)); inner.add(disc); e.bb.push(disc);
  var ring=fatLoop(circlePts(1.55,40), PAL.cyanEye); inner.add(ring); e.bb.push(ring);
  inner.add(fatSegments([0,1.0,0, 0,4.0,0], PAL.magenta));
  var ball=new THREE.Mesh(new THREE.SphereGeometry(0.45,14,10), solid(PAL.white)); ball.position.set(0,4.0,0); inner.add(ball);
}
function buildCube(e, cageColor){
  var cage=new THREE.Group(); var size=6.0;
  cage.add(fatSegments(edgePairs(new THREE.BoxGeometry(size,size,size)), cageColor));
  cage.add(buildMolecule(e,1.15));
  e.group.add(cage); e.cage=cage; e.rollMul=1.0; e.effR=size*0.55; e.colR=5.0; e.band=2;
}
function buildFlag(e){ // flat triangular base on the floor, pole rising from its centre, ring on top
  var ringCol=pick([PAL.pink, PAL.cyanEye, PAL.yellow]);
  var stemCol=pick([PAL.yellow, PAL.magenta, PAL.orange]);
  var triCol =pick([PAL.blue, PAL.magenta, PAL.cyanSat]);
  var base=-2.6, top=5.0, s=2.8;
  var tri=fatLoop([ new THREE.Vector3(0,base,s), new THREE.Vector3(-s*0.86,base,-s*0.5), new THREE.Vector3(s*0.86,base,-s*0.5) ], triCol);
  e.group.add(tri);                                   // lies flat in the XZ plane, not billboarded
  e.group.add(fatSegments([0,base,0, 0,top,0], stemCol));   // pole from triangle centre
  var ring=fatLoop(circlePts(0.85,30), ringCol); ring.position.set(0,top,0); e.group.add(ring); e.bb.push(ring);
  e.cage=null; e.rollMul=0; e.effR=1; e.colR=2.4; e.band=12;
}
function buildDoubleRing(e){
  var r1=fatLoop(circlePts(1.15,34), PAL.yellow); r1.position.set(0,0.5,0); e.group.add(r1); e.bb.push(r1);
  var r2=fatLoop(circlePts(0.75,30), PAL.yellow); r2.position.set(0,-0.5,0); e.group.add(r2); e.bb.push(r2);
  e.group.add(new THREE.Mesh(new THREE.SphereGeometry(0.32,12,10), solid(PAL.orange)));
  e.cage=null; e.rollMul=0; e.effR=1; e.colR=1.6; e.band=9;
}

// ---------- pond creatures ----------
// the swimmers: cubes on spoke-legs, water striders, ring drifters.
function buildSpokeCube(e, cubeCol, spokeCols, footCol, size){
  var cage=new THREE.Group();
  cage.add(fatSegments(edgePairs(new THREE.BoxGeometry(size,size,size)), cubeCol));
  e.group.add(cage); e.cage=cage; e.rollMul=0.8; e.effR=size*0.55; e.colR=size*0.85;
  // legs: rays splayed out past the corners, a small ring at each tip
  var n=5+((Math.random()*3)|0);
  for(var i=0;i<n;i++){
    var d=new THREE.Vector3(Math.random()-0.5, Math.random()*0.7-0.45, Math.random()-0.5)
          .normalize().multiplyScalar(size*0.9+Math.random()*size*0.55);
    e.group.add(fatSegments([0,0,0, d.x,d.y,d.z], pick(spokeCols)));
    if(Math.random()<0.8){
      var ring=fatLoop(circlePts(0.34+Math.random()*0.24,16), footCol);
      ring.position.copy(d); e.group.add(ring); e.bb.push(ring);
    }
  }
}
function buildLamp(e){                       // the white beacon cube, yellow legs, blue ring feet
  buildSpokeCube(e, PAL.white, [PAL.yellow, PAL.yellow, PAL.orange], 0x4fa0ff, 3.0);
  e.band=2; e.hover=1.9; e.dive=2.2+Math.random()*1.2;
}
function buildIce(e){                        // its pale-blue cousin, olive and cyan legs
  buildSpokeCube(e, 0xaee6ff, [0xb9d24a, PAL.cyanSat, 0x4fa0ff], 0x2b8bff, 2.5);
  e.band=3; e.hover=1.6; e.dive=1.7+Math.random()*1.0;
}
function buildStrider(e){                    // long crossed rods, a lime halo at the heart — it rides the skin of the water
  var cage=new THREE.Group(); e.group.add(cage); e.cage=cage;
  var rods=3+((Math.random()*2.6)|0);
  var RODC=[0x1430e8, 0x2b6bff, 0x39c8ff, 0x2bd06a];
  for(var i=0;i<rods;i++){
    var az=Math.random()*Math.PI, tl=(Math.random()-0.5)*1.4;          // properly splayed in 3D
    var L=1.3+Math.random()*1.1;                                       // half the reach
    var dx=Math.cos(az)*Math.cos(tl), dy=Math.sin(tl), dz=Math.sin(az)*Math.cos(tl);
    cage.add(fatSegments([-dx*L,-dy*L,-dz*L, dx*L,dy*L,dz*L], RODC[(Math.random()*RODC.length)|0]));
  }
  var halo=fatLoop(circlePts(0.34,22), 0x7dee32); halo.rotation.x=-Math.PI/2; cage.add(halo);
  var dot=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10), solid(0x35d06a)); cage.add(dot);
  e.rollMul=0.55; e.effR=1.2; e.colR=1.9; e.band=12;                   // it rolls as it travels
  e.spinY=(Math.random()<0.5?-1:1)*(0.25+Math.random()*0.5);
  e.speedScale*=0.45;                                                  // and takes its time
  e.hover=0.42; e.dive=-0.15;                // the strider alone rides on the skin
}
function buildOrbRings(e){                   // tilted yellow ellipses around a pink core, small white rings in tow
  var tilts=2+(Math.random()<0.6?1:0);
  for(var i=0;i<tilts;i++){

// ================= ENVIRONMENT =================
// the field itself: grass fur, terracotta rocks, pale mesh trees, wildflower drifts.
// everything is line-detailed — native 1px strokes over flat dark fills — to sit with the creatures.
var FIELD_R = 85, GROUND_Y = -4.0, HILL_AMP = 1.7;
var envGroup = null, envHeadMat = null, rockCirc = [];
var rnd = Math.random, NSEED = 0;

function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function nHash(ix,iz){ var s=Math.sin(ix*127.1+iz*311.7+NSEED*17.13)*43758.5453; return s-Math.floor(s); }
function vnoise(x,z){
  var ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
  var ux=fx*fx*(3-2*fx), uz=fz*fz*(3-2*fz);
  var a=nHash(ix,iz), b=nHash(ix+1,iz), c=nHash(ix,iz+1), d=nHash(ix+1,iz+1);
  return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz;
}
function fbm(x,z,oct){ var v=0,amp=0.5,f=1; for(var i=0;i<oct;i++){ v+=amp*vnoise(x*f,z*f); f*=2.03; amp*=0.5; } return v; }
function clampf(x,a,b){ return x<a?a:(x>b?b:x); }
function terrainH(x,z){ return GROUND_Y + (fbm(x*0.030+7.7, z*0.030-3.1, 3)-0.5)*2*HILL_AMP; }
function patchLight(x,z){ var v=fbm(x*0.045+21.0, z*0.045+9.0, 3); return clampf((v-0.34)/(0.70-0.34), 0, 1); }
function rimFall(r,x,z){
  var e=(vnoise(x*0.05+3.3, z*0.05+8.8)-0.5)*16;
  var t=clampf((r-(FIELD_R*0.60+e))/(FIELD_R*0.98-(FIELD_R*0.60+e)), 0, 1);
  t=t*t*(3-2*t);
  return 1-t;
}
function inRock(x,z,pad){ for(var i=0;i<rockCirc.length;i++){ var o=rockCirc[i], dx=x-o.x, dz=z-o.z, r=o.r*pad; if(dx*dx+dz*dz<r*r) return true; } return false; }

// grass palette: deep shadow green -> bright lime patch
var GPAL = [ [0.030,0.062,0.016],[0.085,0.190,0.045],[0.235,0.430,0.095],[0.545,0.720,0.160],[0.760,0.870,0.310] ];
function gcol(t,out){
  t=clampf(t,0,0.999)*(GPAL.length-1);
  var i=t|0, f=t-i, A=GPAL[i], B=GPAL[i+1];
  out[0]=A[0]+(B[0]-A[0])*f; out[1]=A[1]+(B[1]-A[1])*f; out[2]=A[2]+(B[2]-A[2])*f;
  return out;
}
// flower head palette (from the styleframes: orange-led, with salmon/pink/cream and the odd red)
var FPAL = { orange:[1.0,0.52,0.08], orange2:[0.94,0.40,0.04], amber:[1.0,0.68,0.20], yellow:[1.0,0.83,0.30],
             salmon:[1.0,0.62,0.44], pink:[0.96,0.62,0.66], dusty:[0.88,0.50,0.56], cream:[0.96,0.92,0.76],
             red:[0.93,0.20,0.12] };
var FKEYS = ["orange","orange","orange2","amber","amber","yellow","salmon","pink","dusty","cream","cream"];
var ST_T=[0.88,0.80,0.58], ST_M=[0.62,0.55,0.38], ST_B=[0.29,0.26,0.17];   // straw stems, dim at the root
var RK_D=[0.30,0.185,0.150], RK_L=[0.640,0.470,0.400];                      // rock shadow -> lit brow

// flora collectors (stems as line segs, heads/speckles as one point cloud)
var stP, stC, hdP, hdC, hdS, hdW;
var envLineMats=[];
function fatFloraSegments(P, C, wmul){            // coloured fat strokes for the pond's plants
  wmul=wmul||0.85;
  if(!FAT){
    var bg=new THREE.BufferGeometry();
    bg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(P),3));
    bg.setAttribute("color",    new THREE.BufferAttribute(new Float32Array(C),3));
    var ls=new THREE.LineSegments(bg, new THREE.LineBasicMaterial({vertexColors:true}));
    ls.frustumCulled=false; return ls;
  }
  var lg=new THREE.LineSegmentsGeometry();
  lg.setPositions(P instanceof Float32Array ? P : new Float32Array(P));
  lg.setColors(C instanceof Float32Array ? C : new Float32Array(C));
  var lm=new THREE.LineMaterial({vertexColors:true, linewidth:LINE_W*wmul});
  if(lm.resolution) lm.resolution.set(window.innerWidth, window.innerHeight);
  lm.wmul=wmul; envLineMats.push(lm);
  var seg=new THREE.LineSegments2(lg, lm);
  if(seg.computeLineDistances) seg.computeLineDistances();
  seg.frustumCulled=false;
  return seg;
}
function addDot(x,y,z,c,s,w){ hdP.push(x,y,z); hdC.push(c[0],c[1],c[2]); hdS.push(s); hdW.push(w||0); }
function stemSeg(ax,ay,az,bx,by,bz,c0,c1){ stP.push(ax,ay,az,bx,by,bz); stC.push(c0[0],c0[1],c0[2],c1[0],c1[1],c1[2]); }
function pickPal(){ var a=FPAL[FKEYS[(rnd()*FKEYS.length)|0]], b=FPAL[FKEYS[(rnd()*FKEYS.length)|0]]; return [a,a,b]; }
function addFlower(x,y,z,scale,pal,leanMul){
  var h=(3.0+rnd()*3.6)*scale;
  var a=rnd()*6.2832, lm=(0.5+rnd()*1.3)*scale*(leanMul||1);
  var lx=Math.cos(a)*lm, lz=Math.sin(a)*lm;
  var mx=x+lx*0.32, my=y+h*0.55, mz=z+lz*0.32;
  var tx=x+lx, ty=y+h, tz=z+lz;
  stemSeg(x,y,z, mx,my,mz, ST_B, ST_M);
  stemSeg(mx,my,mz, tx,ty,tz, ST_M, ST_T);
  var c = pal[(rnd()*pal.length)|0];
  var heads = (rnd()<0.42) ? 2+((rnd()*3)|0) : 1;
  if(heads===1){
    addDot(tx, ty+0.1*scale, tz, (rnd()<0.85?c:FPAL[FKEYS[(rnd()*FKEYS.length)|0]]), (0.45+rnd()*0.50)*scale);
  } else {
    for(var k=0;k<heads;k++){                     // umbel: short pedicels spraying from the tip
      var ba=rnd()*6.2832, br=(0.5+rnd()*1.2)*scale, bu=(0.3+rnd()*1.0)*scale;
      var hx=tx+Math.cos(ba)*br, hz=tz+Math.sin(ba)*br, hy=ty+bu;
      stemSeg(tx,ty,tz, hx,hy,hz, ST_M, ST_T);
      var cc=(rnd()<0.8)?c:FPAL[FKEYS[(rnd()*FKEYS.length)|0]];
      addDot(hx,hy,hz, cc, (0.35+rnd()*0.40)*scale);
    }
  }
}

function buildGround(){
  var seg=88, size=FIELD_R*2.4;
  var g=new THREE.PlaneGeometry(size,size,seg,seg);
  g.rotateX(-Math.PI/2);
  var pos=g.attributes.position, n=pos.count, col=new Float32Array(n*3), C=[0,0,0];
  for(var i=0;i<n;i++){
    var x=pos.getX(i), z=pos.getZ(i), r=Math.sqrt(x*x+z*z);
    pos.setY(i, terrainH(x,z)-0.22);
    var rf=rimFall(r,x,z);
    gcol(patchLight(x,z)*0.42, C);
    var m=rf*0.42;
    col[i*3]=C[0]*m; col[i*3+1]=C[1]*m; col[i*3+2]=C[2]*m;
  }
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  envGroup.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide})));
}

function buildGrass(){
  var target=Math.floor(80000*params.grass), tries=Math.floor(target*1.35);
  var pos=new Float32Array(target*12), col=new Float32Array(target*12);
  var n=0, C=[0,0,0];
  for(var i=0;i<tries && n<target;i++){
    var rr=FIELD_R*Math.sqrt(rnd()), a=rnd()*6.2832;
    var x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    var rf=rimFall(rr,x,z); if(rf<0.02) continue;
    if(inRock(x,z,0.80)) continue;
    var y0=terrainH(x,z);
    var L=patchLight(x,z);
    var h=(2.3+rnd()*2.1)*(0.75+0.55*L);
    var fa=fbm(x*0.02+51.0, z*0.02+13.0, 2)*12.566 + (rnd()-0.5)*1.3;   // combed in patches
    var lm=(0.30+rnd()*0.85)*(0.55+0.9*vnoise(x*0.035+4.0, z*0.035));
    var lx=Math.cos(fa)*lm, lz=Math.sin(fa)*lm;
    var hh=clampf((y0-(GROUND_Y-HILL_AMP))/(2*HILL_AMP), 0, 1);          // hollows read darker
    gcol(clampf(L+(rnd()-0.5)*0.20, 0, 1), C);
    var m=rf*(0.55+0.45*hh);
    var r0=C[0]*m, g0=C[1]*m, b0=C[2]*m;
    var o=n*12;
    pos[o]=x;            pos[o+1]=y0;          pos[o+2]=z;              // base -> mid
    pos[o+3]=x+lx*0.35;  pos[o+4]=y0+h*0.62;   pos[o+5]=z+lz*0.35;
    pos[o+6]=pos[o+3];   pos[o+7]=pos[o+4];    pos[o+8]=pos[o+5];       // mid -> tip
    pos[o+9]=x+lx;       pos[o+10]=y0+h;       pos[o+11]=z+lz;
    col[o]  =r0*0.40; col[o+1]=g0*0.40; col[o+2]=b0*0.40;               // dark at the root
    col[o+3]=r0*0.85; col[o+4]=g0*0.85; col[o+5]=b0*0.85;
    col[o+6]=col[o+3]; col[o+7]=col[o+4]; col[o+8]=col[o+5];
    col[o+9]=Math.min(1,r0*1.15); col[o+10]=Math.min(1,g0*1.15); col[o+11]=Math.min(1,b0*1.15);
    n++;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos.slice(0,n*12),3));
  g.setAttribute("color",    new THREE.BufferAttribute(col.slice(0,n*12),3));
  envGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true})));
}

function makeRock(d){
  var geo=new THREE.IcosahedronGeometry(1, d.mono?4:3);
  var pos=geo.attributes.position, n=pos.count;
  var ry=d.h*0.60, rz=d.rx*(0.68+rnd()*0.62);
  var so=rnd()*97.0, yaw=rnd()*6.2832, cw=Math.cos(yaw), sw=Math.sin(yaw);
  var gy=terrainH(d.x,d.z)+ry*0.05;
  var i,x,y,z;
  for(i=0;i<n;i++){
    x=pos.getX(i); y=pos.getY(i); z=pos.getZ(i);                        // unit sphere in
    var rD=1+(fbm(x*2.1+y*1.6+so, z*2.1-y*1.3+so*0.6, 3)-0.5)*0.62
            +(vnoise(x*0.8+so, z*0.8+y*0.7)-0.5)*0.46;
    var px=x*rD*d.rx, py=y*rD*ry, pz=z*rD*rz;
    if(py<-ry*0.14) py=-ry*0.14+(py+ry*0.14)*0.22;                      // settle the base flat-ish
    pos.setXYZ(i, px*cw-pz*sw, py, px*sw+pz*cw);
  }
  geo.computeVertexNormals();
  var nor=geo.attributes.normal, col=new Float32Array(n*3);
  for(i=0;i<n;i++){
    x=pos.getX(i); y=pos.getY(i); z=pos.getZ(i);
    var hgt=clampf((y/ry+1)/2, 0, 1);
    var mott=fbm(x*0.33+so, z*0.33+y*0.29, 3);
    var t=clampf(0.20+hgt*0.52+(nor.getY(i)*0.5+0.5)*0.22+(mott-0.5)*0.55, 0, 1);
    col[i*3]  =RK_D[0]+(RK_L[0]-RK_D[0])*t;
    col[i*3+1]=RK_D[1]+(RK_L[1]-RK_D[1])*t;
    col[i*3+2]=RK_D[2]+(RK_L[2]-RK_D[2])*t;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col,3));
  var fill=new THREE.Mesh(geo, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1}));
  fill.position.set(d.x, gy, d.z);
  envGroup.add(fill);
  var footR=Math.max(d.rx,rz)*0.95;
  rockCirc.push({x:d.x, z:d.z, r:footR});

  // yellow lichen colonising the rock, moss in the creases
  var placed=0, cap=d.mono?1100:420, lt=0;
  while(placed<cap && lt++<cap*9){
    i=((rnd()*n)|0);
    x=pos.getX(i); y=pos.getY(i); z=pos.getZ(i);
    var nyy=nor.getY(i);
    if(nyy<0.12) continue;
    if(fbm(x*0.5+so*1.7, z*0.5+y*0.4, 2)<0.50) continue;               // it grows in patches
    if(rnd()>0.42+nyy*0.40) continue;
    var gy2=0.96+rnd()*0.09;
    addDot(d.x+x, gy+y+0.10, d.z+z, [1.0, 0.827*gy2, 0.071], 0.12+rnd()*0.17);
    placed++;
  }
  var mossN=0, mossCap=d.mono?60:24;
  for(i=0;i<n;i+=3){
    x=pos.getX(i); y=pos.getY(i); z=pos.getZ(i);
    if(nor.getY(i)>0.15 && mossN<mossCap && fbm(x*0.4+so*2.3+9.0, z*0.4+y*0.5, 2)>0.66 && rnd()<0.5){
      addDot(d.x+x, gy+y+0.08, d.z+z, [0.30,0.46,0.30], 0.20+rnd()*0.22);
      mossN++;
    }
  }
  // the odd flower rooted on top of the rock
  var nf=d.mono?(5+((rnd()*5)|0)):(rnd()<0.6?(2+((rnd()*3)|0)):0);
  var pal=pickPal(), guard=0;
  while(nf>0 && guard<400){
    guard++;
    i=(((rnd()*(n/3))|0)*3);
    if(nor.getY(i)<0.55) continue;
    addFlower(d.x+pos.getX(i), gy+pos.getY(i), d.z+pos.getZ(i), 0.45+rnd()*0.45, pal, 0.6);
    nf--;
  }
  // pale dust drifting around the base
  var nb=d.mono?90:30;
  for(i=0;i<nb;i++){
    var ba=rnd()*6.2832, br=footR*(1.02+rnd()*0.5);
    var bx=d.x+Math.cos(ba)*br, bz=d.z+Math.sin(ba)*br;
    if(Math.sqrt(bx*bx+bz*bz)>FIELD_R*0.95) continue;
    addDot(bx, terrainH(bx,bz)+1.2+rnd()*1.4, bz, rnd()<0.7?FPAL.cream:FPAL.yellow, 0.16+rnd()*0.20);
  }
}
function buildRocks(){
  var defs=[], i, a, dd;
  var cx=(rnd()*2-1)*11, cz=(rnd()*2-1)*11;
  defs.push({x:cx, z:cz, rx:7.5+rnd()*3.0, h:19+rnd()*10, mono:true});        // the monolith
  var nm=3+((rnd()*3)|0);
  for(i=0;i<nm;i++){ a=rnd()*6.2832; dd=9+rnd()*13;                            // shoulder boulders
    defs.push({x:cx+Math.cos(a)*dd, z:cz+Math.sin(a)*dd, rx:3.4+rnd()*3.4, h:4.5+rnd()*6, mono:false}); }
  var ns=4+((rnd()*4)|0);
  for(i=0;i<ns;i++){ a=rnd()*6.2832; dd=14+rnd()*22;                           // satellites
    defs.push({x:cx+Math.cos(a)*dd, z:cz+Math.sin(a)*dd, rx:1.6+rnd()*2.0, h:1.8+rnd()*2.6, mono:false}); }
  for(i=0;i<defs.length;i++) makeRock(defs[i]);
}

function makeTree(x,z,fallen){
  var P=[], I=[], so=rnd()*57.0;
  function tube(pts,r0,r1,rad){
    var nR=pts.length, i,k;
    var dir=new THREE.Vector3(), u=new THREE.Vector3(), v=new THREE.Vector3(), tmp=new THREE.Vector3();
    var start=P.length/3;
    for(i=0;i<nR;i++){
      dir.subVectors(pts[Math.min(nR-1,i+1)], pts[Math.max(0,i-1)]).normalize();
      tmp.set(0,1,0); if(Math.abs(dir.y)>0.9) tmp.set(1,0,0);
      u.crossVectors(dir,tmp).normalize();
      v.crossVectors(dir,u);
      var ti=i/(nR-1), rr=r0+(r1-r0)*Math.pow(ti,0.85);
      for(k=0;k<rad;k++){
        var ang=k/rad*6.2832, ca=Math.cos(ang), sa=Math.sin(ang);
        var jr=rr*(1+(vnoise(pts[i].x*1.4+so+k*3.7, pts[i].z*1.4+pts[i].y*0.9)-0.5)*0.34);
        P.push(pts[i].x+(u.x*ca+v.x*sa)*jr, pts[i].y+(u.y*ca+v.y*sa)*jr, pts[i].z+(u.z*ca+v.z*sa)*jr);
      }
    }
    for(i=0;i<nR-1;i++){ for(k=0;k<rad;k++){
      var a0=start+i*rad+k, a1=start+i*rad+(k+1)%rad, b0=a0+rad, b1=a1+rad;
      I.push(a0,b0,a1, a1,b0,b1);

  }
  function branch(origin,dir,len,r0,depth,maxD){
    var steps=4, pts=[origin.clone()], p=origin.clone(), d=dir.clone(), s;
    for(s=0;s<steps;s++){
      d.x+=(rnd()-0.5)*0.55; d.y+=(rnd()-0.5)*0.38+(fallen?0.02:0.16); d.z+=(rnd()-0.5)*0.55;
      d.normalize();
      p=p.clone().addScaledVector(d, len/steps);
      pts.push(p);
    }

    var r1=last?0.03:r0*(0.52+rnd()*0.16);
    tube(pts, r0, r1, r0>0.8?9:(r0>0.35?7:5));
    if(!last){
      var nc=depth===0?(2+((rnd()*2)|0)):((rnd()<0.7?1:2)+(rnd()<0.25?1:0));
      for(var c=0;c<nc;c++){
        var nd=d.clone(), tmp2=new THREE.Vector3(0,1,0);
        if(Math.abs(nd.y)>0.9) tmp2.set(1,0,0);
        var pu=new THREE.Vector3().crossVectors(nd,tmp2).normalize();
        var pv=new THREE.Vector3().crossVectors(nd,pu);

        var perp=pu.multiplyScalar(Math.cos(az)).addScaledVector(pv,Math.sin(az));
        nd.multiplyScalar(Math.cos(tilt)).addScaledVector(perp,Math.sin(tilt)).normalize();
        var org=(c===0)?pts[pts.length-1]:pts[1+((rnd()*(pts.length-1))|0)];
        branch(org.clone(), nd, len*(0.60+rnd()*0.22), r1*(0.85+rnd()*0.2), depth+1, maxD);
      }
    }
  }
  var y0=terrainH(x,z);
  if(fallen){
    branch(new THREE.Vector3(x,y0+0.35,z), new THREE.Vector3(rnd()-0.5,0.06,rnd()-0.5).normalize(), 9+rnd()*8, 0.55+rnd()*0.4, 2, 3);
  } else {
    branch(new THREE.Vector3(x,y0-0.8,z), new THREE.Vector3((rnd()-0.5)*0.5,1,(rnd()-0.5)*0.5).normalize(), 8+rnd()*7, 0.95+rnd()*0.65, 0, 3);
    envObstacles.push({x:x, z:z, r:2.4});
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(P),3));
  g.setIndex(I);
  envGroup.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:0x131009, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1})));

}
function buildTrees(){

  while(placed<nt && guard++<80){
    a=rnd()*6.2832; r=16+rnd()*46;

  var nfall=1+(rnd()<0.5?1:0);                     // a fallen limb or two in the grass
  for(var i=0;i<nfall;i++){
    a=rnd()*6.2832; r=10+rnd()*34;
    x=Math.cos(a)*r; z=Math.sin(a)*r;

function flowerCluster(cx,cz,count,sigma,pal){
  if(Math.sqrt(cx*cx+cz*cz)>FIELD_R*0.9) return;
  for(var i=0;i<count;i++){
    var a=rnd()*6.2832, r=sigma*Math.sqrt(rnd())*(1+rnd()*0.6);
    var x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
    var rr=Math.sqrt(x*x+z*z);
    if(inRock(x,z,1.02)) continue;
    if(rimFall(rr,x,z)<0.15) continue;
    addFlower(x, terrainH(x,z), z, 0.6+rnd()*0.75, pal, 1);
  }
}
function buildFlowers(){
  var mul=params.flowers, i, k;
  for(i=0;i<rockCirc.length;i++){                  // drifts hugging the rock bases
    var o=rockCirc[i], nc=2+((rnd()*3)|0);

      var ca=rnd()*6.2832, cd=o.r*(1.05+rnd()*0.55);

    }
  }
  var nf=Math.round((7+rnd()*5)*mul);              // free-standing drifts
  for(i=0;i<nf;i++){
    var fa=rnd()*6.2832, fr=FIELD_R*(0.15+0.68*rnd());
    flowerCluster(Math.cos(fa)*fr, Math.sin(fa)*fr, Math.round(8+rnd()*20), 3+rnd()*5, pickPal());
  }
  var nl=Math.round(240*mul);                      // loners
  for(i=0;i<nl;i++){
    var la=rnd()*6.2832, lr=FIELD_R*Math.sqrt(rnd())*0.92;
    var x=Math.cos(la)*lr, z=Math.sin(la)*lr;

  }
  var ns=Math.round(420*mul);                      // tiny understory specks: cream, yellow, the odd red
  for(i=0;i<ns;i++){
    var sa=rnd()*6.2832, sr=FIELD_R*Math.sqrt(rnd())*0.9;
    var sx=Math.cos(sa)*sr, sz=Math.sin(sa)*sr;

    addDot(sx, terrainH(sx,sz)+1.6+rnd()*1.6, sz, cc, 0.14+rnd()*0.16);

function finalizeFlora(){

        "  vC=hcol;",

        "  if(hphs>0.0){",                       // foam drifts and twinkles; everything else holds still
        "    float ph=hphs*6.2831;",

// ================= POND WORLD =================
// the second world: a luminous blue pool with pale sand islands rising out of it.
// the creatures swim here — half in the water — and haul themselves up onto the rocks.
// same language as the field: flat fills, 1px strokes, dots for everything soft.
var PW_R = 64, PW_Y = -3.4, PW_BED = 11.0;
var envRocks = [];          // the islands, kept around so the creatures know where to climb
var envHazeMat = null;
var waterScene = null, waterGroup = null;   // the water film draws last, after the swimmers

// blobby coastline: the pool's edge wanders with the noise field
function pondEdgeR(x,z){ return PW_R*(0.86 + (fbm(x*0.020+7.0, z*0.020+3.0, 3)-0.5)*0.60); }
function sstep(a,b,x){ var t=clampf((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function pondLobe(o,az){
  var c=Math.cos(az), s=Math.sin(az);
  return Math.max(0.42,
         1+(fbm(c*1.3+o.lseed, s*1.3+o.lseed, 2)-0.5)*1.25
          +(fbm(c*3.1-o.lseed*0.7, s*3.1+o.lseed*1.3, 2)-0.5)*0.55);
}
function pondBright(x,z){                         // a broad wash of light across the whole pool
  var r=Math.sqrt(x*x+z*z), pr=pondEdgeR(x,z), u=r/pr;
  return sstep(0.04,0.30,u)*(1-sstep(0.22,1.24,u))*(1-0.78*pondRockNear(x,z));
}
function pondFootR(o,az){                         // the mesh's real wall radius at floor depth
  var c=Math.cos(az), s=Math.sin(az);
  var rD=1+(fbm(c*1.5+o.so, s*1.5+o.so*0.6, 3)-0.5)*0.55
          +(vnoise(c*0.7+o.so, s*0.7)-0.5)*0.20;  // same noise the vertices drank
  return rD*pondLobe(o,az);
}
function pondFootGlow(x,z){                       // a ring where the rock meets the seabed
  var m=0;
  for(var i=0;i<envRocks.length;i++){
    var o=envRocks[i], dx=x-o.x, dz=z-o.z;
    var lx=(dx*o.c + dz*o.s)/o.rx, lz=(-dx*o.s + dz*o.c)/o.rz;
    var q0=lx*lx+lz*lz;
    if(q0>16) continue;
    var az=Math.atan2(lz,lx);
    var s=pondFootR(o,az)*0.99;                   // trace the true footprint
    var rAz=Math.sqrt(Math.pow(Math.cos(az)*o.rx,2)+Math.pow(Math.sin(az)*o.rz,2));
    var wd=(Math.sqrt(q0)-s)*rAz;                 // world-space gap to the wall
    var g=1-Math.abs(wd)/6.0;                     // same generous width on every rock
    if(g>m) m=g;
  }
  return clampf(m,0,1);
}

// where does the ground sit under (x,z)? water level, unless an island dome rises past it.
// the creatures spring toward this, so swimming and climbing fall out of one rule.
function envSurfaceY(x,z){
  var y=PW_Y;
  for(var i=0;i<envRocks.length;i++){
    var o=envRocks[i], dx=x-o.x, dz=z-o.z;
    var lx=(dx*o.c + dz*o.s)/o.rx, lz=(-dx*o.s + dz*o.c)/o.rz;
    var lw=pondLobe(o, Math.atan2(lz,lx));
    var lx1=lx/lw, lz1=lz/lw, q1=1-lx1*lx1-lz1*lz1;
    if(q1>0){
      var lw2=1+(lw-1)*(1-Math.sqrt(q1)*0.35);                          // the mesh eases its lobes at the crown
      lx/=lw2; lz/=lw2;
      var q=1 - lx*lx - lz*lz;
      if(q>0){ var yu=Math.sqrt(q);
        var sy=o.cy + o.ry*(yu*0.94 + (fbm(lx*1.1+o.rseed, lz*1.1-o.rseed, 2)-0.5)*0.38*yu);
        if(sy>y) y=sy; }
    }
  }
  return y;
}
function envDomeY(x,z){                           // the sand itself, even under the water — swimmers ride the slope up
  var y=-999;
  for(var i=0;i<envRocks.length;i++){
    var o=envRocks[i], dx=x-o.x, dz=z-o.z;
    var lx=(dx*o.c + dz*o.s)/o.rx, lz=(-dx*o.s + dz*o.c)/o.rz;
    var lw=pondLobe(o, Math.atan2(lz,lx));
    var lx1=lx/lw, lz1=lz/lw, q1=1-lx1*lx1-lz1*lz1;
    if(q1>0){
      var lw2=1+(lw-1)*(1-Math.sqrt(q1)*0.35);                          // the mesh eases its lobes at the crown
      lx/=lw2; lz/=lw2;
      var q=1 - lx*lx - lz*lz;
      if(q>0){ var yu=Math.sqrt(q);
        var sy=o.cy + o.ry*(yu*0.94 + (fbm(lx*1.1+o.rseed, lz*1.1-o.rseed, 2)-0.5)*0.38*yu);
        if(sy>y) y=sy; }
    }
  }
  return y;
}
function pondRockNear(x,z){                       // 1 right at an island's foot, 0 out in open water
  var m=0;
  for(var i=0;i<envRocks.length;i++){
    var o=envRocks[i], dx=x-o.x, dz=z-o.z;
    var lx=(dx*o.c + dz*o.s)/o.rx, lz=(-dx*o.s + dz*o.c)/o.rz;
    var q0=lx*lx+lz*lz;
    if(q0>16) continue;                           // far out in open water: no pull
    var nd=Math.sqrt(q0)/Math.max(0.05, pondFootR(o, Math.atan2(lz,lx)));
    var v=1-sstep(0.60,1.45,nd);                  // hugging the real silhouette
    if(v>m) m=v;
  }
  return m;
}
function onIsland(x,z,pad){                       // above the waterline of any island?
  for(var i=0;i<envRocks.length;i++){
    var o=envRocks[i], dx=x-o.x, dz=z-o.z;
    var lx=(dx*o.c + dz*o.s)/o.rx, lz=(-dx*o.s + dz*o.c)/o.rz;
    var lw=pondLobe(o, Math.atan2(lz,lx)); lx/=lw; lz/=lw;
    var w=o.wf*pad;
    if(lx*lx+lz*lz < w*w) return true;
  }
  return false;
}

function addTwig(x,z,scale,yr){                   // white berry twig, red beads at the tips

function makePondIsland(d){                       // pale sand mound; the water cuts its base
  var geo=new THREE.IcosahedronGeometry(1,4);
  var pos=geo.attributes.position, n=pos.count, i, x, y, z;
  var so=rnd()*100, cw=Math.cos(d.yaw), sw=Math.sin(d.yaw);
  d.lseed=so; d.rseed=so*1.7;
  for(i=0;i<n;i++){
    x=pos.getX(i); y=pos.getY(i); z=pos.getZ(i);                        // unit sphere in
    var rD=1+(fbm(x*1.5+y*1.1+so, z*1.5-y*0.9+so*0.6, 3)-0.5)*0.55
            +(vnoise(x*0.7+so, z*0.7+y*0.6)-0.5)*0.20;                  // properly craggy
    var lw=pondLobe(d, Math.atan2(z,x));                                // slow lobes push the coast out
    var lh=1+(lw-1)*(1-clampf(y,0,1)*0.35);                             // the crown keeps most of its gnarl
    var px=x*rD*lh*d.rx, py=y*rD*d.ry, pz=z*rD*lh*d.rz;
    py += (fbm(x*1.1+d.rseed, z*1.1-d.rseed, 2)-0.5)*d.ry*0.38*Math.max(0,y);  // ridged, tilted tops
    pos.setXYZ(i, px*cw-pz*sw, py, px*sw+pz*cw);
  }
  geo.computeVertexNormals();
  var nor=geo.attributes.normal, col=new Float32Array(n*3);
  for(i=0;i<n;i++){
    y=pos.getY(i); x=pos.getX(i); z=pos.getZ(i);
    var hgt=clampf((y/d.ry+1)/2, 0, 1);
    var mott=fbm(x*0.22+so, z*0.22+y*0.20, 3);
    var t=clampf(0.24+hgt*0.50+(nor.getY(i)*0.5+0.5)*0.20+(mott-0.5)*0.30, 0, 1);
    var wy=y+d.cy, sub=sstep(PW_Y-1.2, PW_Y+0.4, wy);                   // sand above the line
    var dz2=clampf((wy-(PW_Y-PW_BED))/(PW_BED-0.5), 0, 1);              // 1 at the line, 0 at the bed
    var k2=(1-dz2)*(1-dz2);                                             // deep royal holds long, lights up only near the floor
    var ur=0.018+(0.055-0.018)*k2, ug=0.032+(0.130-0.032)*k2, ub=0.20+(0.42-0.20)*k2;
    col[i*3]  =ur+(SND_D[0]+(SND_L[0]-SND_D[0])*t-ur)*sub;
    col[i*3+1]=ug+(SND_D[1]+(SND_L[1]-SND_D[1])*t-ug)*sub;
    col[i*3+2]=ub+(SND_D[2]+(SND_L[2]-SND_D[2])*t-ub)*sub;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col,3));
  var fill=new THREE.Mesh(geo, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1}));
  fill.position.set(d.x, d.cy, d.z);
  envGroup.add(fill);

  // fine stipple: thousands of tiny darker grains give the knitted-sand texture
  var faces=(n/3)|0, area=d.rx*d.rz, sN=Math.min(9000, Math.floor(30*area));
  var sp=new Float32Array(sN*3), sc=new Float32Array(sN*3);
  for(i=0;i<sN;i++){
    var f=((rnd()*faces)|0)*3;
    var u=rnd(), v=rnd(); if(u+v>1){ u=1-u; v=1-v; }
    var w=1-u-v;
    var gx=pos.getX(f)*w+pos.getX(f+1)*u+pos.getX(f+2)*v;
    var gy=pos.getY(f)*w+pos.getY(f+1)*u+pos.getY(f+2)*v;
    var gz=pos.getZ(f)*w+pos.getZ(f+1)*u+pos.getZ(f+2)*v;
    var nx2=nor.getX(f), ny2=nor.getY(f), nz2=nor.getZ(f);
    sp[i*3]=gx+nx2*0.07; sp[i*3+1]=gy+ny2*0.07; sp[i*3+2]=gz+nz2*0.07;
    var sm=0.62+rnd()*0.24;
    var wy2=gy+d.cy, sub2=sstep(PW_Y-1.2, PW_Y+0.4, wy2);
    var dz3=clampf((wy2-(PW_Y-PW_BED))/(PW_BED-0.5), 0, 1);
    var k3=(1-dz3)*(1-dz3);
    var vr=0.022+(0.065-0.022)*k3, vg=0.040+(0.155-0.040)*k3, vb=0.23+(0.48-0.23)*k3;
    sc[i*3]  =vr+(SND_D[0]*sm-vr)*sub2;
    sc[i*3+1]=vg+(SND_D[1]*sm-vg)*sub2;
    sc[i*3+2]=vb+(SND_D[2]*sm-vb)*sub2;
  }
  var sg=new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.BufferAttribute(sp,3));
  sg.setAttribute("color",    new THREE.BufferAttribute(sc,3));
  var stip=new THREE.Points(sg, new THREE.PointsMaterial({vertexColors:true, size:0.13, sizeAttenuation:true}));
  stip.position.copy(fill.position); stip.frustumCulled=false;
  envGroup.add(stip);

  // yellow lichen: dense clusters colonising the tops
  var gold=0, cap=9500, gTry=Math.floor(area*40);  // lichen: the whole dry surface, thousands strong
  for(i=0;i<gTry && gold<cap;i++){
    var gf=((rnd()*faces)|0)*3;
    var gu=rnd(), gv=rnd(); if(gu+gv>1){ gu=1-gu; gv=1-gv; }
    var gw=1-gu-gv;
    var gx2=pos.getX(gf)*gw+pos.getX(gf+1)*gu+pos.getX(gf+2)*gv;
    var gy3=pos.getY(gf)*gw+pos.getY(gf+1)*gu+pos.getY(gf+2)*gv;
    var gz2=pos.getZ(gf)*gw+pos.getZ(gf+1)*gu+pos.getZ(gf+2)*gv;
    var ny3=nor.getY(gf);
    if(ny3<=0.10) continue;                                             // not the underhangs
    if(gy3+d.cy<=PW_Y+0.3) continue;                                    // only above the waterline
    if(rnd()>0.45+ny3*0.40) continue;                                   // even scatter, denser facing the sky
    var gy2=0.96+rnd()*0.09;                                            // #ffd312, breathing a little
    addDot(d.x+gx2, d.cy+gy3+0.10, d.z+gz2, [1.0, 0.827*gy2, 0.071], 0.10+rnd()*0.10);
    gold++;
  }

  // waterline foam: anchored to the mesh's true shoreline, so the rind fits snug
  var emerges=(d.cy+d.ry*0.94 > PW_Y+0.6);
  var wf=Math.sqrt(Math.max(0.05, 1-Math.pow((PW_Y-d.cy)/d.ry,2)));
  var wl=[], wtry=0;
  while(emerges && wl.length<260 && wtry++<12000){
    var bf=((rnd()*faces)|0)*3;
    var bu=rnd(), bv=rnd(); if(bu+bv>1){ bu=1-bu; bv=1-bv; }
    var bw=1-bu-bv;
    var bx3=pos.getX(bf)*bw+pos.getX(bf+1)*bu+pos.getX(bf+2)*bv;
    var by3=pos.getY(bf)*bw+pos.getY(bf+1)*bu+pos.getY(bf+2)*bv;
    var bz3=pos.getZ(bf)*bw+pos.getZ(bf+1)*bu+pos.getZ(bf+2)*bv;
    var bwy=by3+d.cy;
    if(bwy>PW_Y-0.5 && bwy<PW_Y+0.9) wl.push([d.x+bx3, d.z+bz3]);
  }
  var fN=(emerges && wl.length) ? Math.min(2600, Math.floor(70*(d.rx+d.rz))) : 0;
  for(i=0;i<fN;i++){
    var an=wl[(rnd()*wl.length)|0];
    var vx3=an[0]-d.x, vz3=an[1]-d.z, vl3=Math.sqrt(vx3*vx3+vz3*vz3)||1;
    var out=Math.pow(rnd(),2.0)*2.0;               // dense at the shore, scattering thinner outward
    var tj=(rnd()-0.5)*1.2;                        // slide a little along the shoreline
    addDot(an[0]+(vx3/vl3)*out+(-vz3/vl3)*tj, PW_Y+0.06+Math.pow(rnd(),2.2)*0.9,
           an[1]+(vz3/vl3)*out+( vx3/vl3)*tj, [1.0,1.0,1.0], 0.10+rnd()*0.20, 0.05+rnd()*0.95);
  }
  // drifting foam patches just offshore, hanging off real shore points
  var pat=(emerges && wl.length) ? 1+((rnd()*2)|0) : 0;
  for(i=0;i<pat;i++){
    var an2=wl[(rnd()*wl.length)|0];
    var vx4=an2[0]-d.x, vz4=an2[1]-d.z, vl4=Math.sqrt(vx4*vx4+vz4*vz4)||1;
    var po=0.8+rnd()*1.6;
    speckCluster(an2[0]+(vx4/vl4)*po, an2[1]+(vz4/vl4)*po, 26+((rnd()*34)|0), 1.1+rnd()*1.4, 0.9);
  }

  var spots=[], stry=0;
  while(spots.length<260 && stry++<1400){
    var af=((rnd()*faces)|0)*3;
    var au=rnd(), av=rnd(); if(au+av>1){ au=1-au; av=1-av; }
    var aw=1-au-av;
    var ax2=pos.getX(af)*aw+pos.getX(af+1)*au+pos.getX(af+2)*av;
    var ay2=pos.getY(af)*aw+pos.getY(af+1)*au+pos.getY(af+2)*av;
    var az2=pos.getZ(af)*aw+pos.getZ(af+1)*au+pos.getZ(af+2)*av;
    if(nor.getY(af)<=0.35) continue;
    if(ay2+d.cy<=PW_Y+1.0) continue;
    spots.push([d.x+ax2, d.cy+ay2, d.z+az2]);
  }
  envRocks.push({spots:spots, so:so, x:d.x, z:d.z, lseed:d.lseed, rseed:d.rseed, rx:d.rx, ry:d.ry, rz:d.rz, cy:d.cy, yaw:d.yaw, c:Math.cos(d.yaw), s:Math.sin(d.yaw), wf:wf});
}

function buildPondRocks(){
  // hero rocks: 2-4 of them, free to crowd right up against each other
  var heroes=2+((rnd()*3.5)|0), placedH=[];    // 2-5 of them
  for(var hk=0;hk<heroes;hk++){
    var hR = (hk===0) ? 18+rnd()*4 : 10+rnd()*7;
    var h={ rx:hR, rz:hR*(0.68+rnd()*0.42),
            ry:hR*((hk===0?1.12:1.18)+rnd()*(hk===0?0.22:0.26)),
            yaw:rnd()*6.2832, cy:PW_Y-PW_BED };   // all born of the seabed
    var okP=false, htry=0;
    while(!okP && htry++<10){
      if(hk===0){
        var hA=rnd()*6.2832, hD=6+rnd()*8;
        h.x=Math.cos(hA)*hD; h.z=Math.sin(hA)*hD; okP=true;
      } else {
        var base=placedH[(rnd()*placedH.length)|0];
        var bb=rnd()*6.2832;
        var gap=(Math.max(base.rx,base.rz)+Math.max(h.rx,h.rz))*(0.55+Math.pow(rnd(),1.4)*0.80);   // properly fused through to a narrow channel
        h.x=base.x+Math.cos(bb)*gap; h.z=base.z+Math.sin(bb)*gap;
        okP=(Math.hypot(h.x,h.z)<PW_R*0.62);      // keep the cluster inside the pool
      }
    }
    if(!okP) continue;
    makePondIsland(h); placedH.push(h);
  }
  var extras=(rnd()<0.8?1:0)+((rnd()*2.6)|0);     // 0-3 more: sometimes a whole archipelago
  for(var xk=0;xk<extras;xk++){
    var A3=rnd()*6.2832, smR=4+rnd()*5;
    var sm={ x:Math.cos(A3)*(25+rnd()*13), z:Math.sin(A3)*(25+rnd()*13),
             rx:smR, rz:smR*(0.72+rnd()*0.38), ry:smR*(1.0+rnd()*0.6),
             yaw:rnd()*6.2832, cy:0 };
    sm.cy=PW_Y-PW_BED;                            // the small ones become reefs, sometimes skerries
    var clear=true;                               // keep a little water between them
    for(var xe=0;xe<envRocks.length;xe++){
      var eo=envRocks[xe], edx=sm.x-eo.x, edz=sm.z-eo.z;
      if(Math.sqrt(edx*edx+edz*edz) < (Math.max(eo.rx,eo.rz)+smR)*0.9){ clear=false; break; }
    }
    if(clear) makePondIsland(sm);
  }

  // berry thickets take the high ground — rooted at true mesh points, so nothing floats
  for(var ri=0;ri<envRocks.length;ri++){
    var o=envRocks[ri], sp3=o.spots||[];
    if(!sp3.length) continue;
    var patches=(o.rx>12)?(2+((rnd()*2)|0)):1;
    var tscale=1.0+o.rx/20;
    for(var pch=0;pch<patches;pch++){
      var ctr=sp3[(rnd()*sp3.length)|0];
      var tn=(7+((rnd()*10)|0))*(o.rx>12?1.3:1)*Math.min(params.flowers,1.5)|0;
      var placed=0, tguard=0;
      while(placed<tn && tguard++<tn*10){
        var s4=sp3[(rnd()*sp3.length)|0];
        var ddx=s4[0]-ctr[0], ddz=s4[2]-ctr[2];
        if(ddx*ddx+ddz*ddz>49) continue;                                // stay within the patch
        addTwig(s4[0], s4[2], tscale, s4[1]-0.35);
        placed++;
      }
    }
  }
}

function buildPondBed(){                          // a dim dappled floor, seen through the film
  var seg=110, W2=FIELD_R*2.4;
  var g=new THREE.PlaneGeometry(W2,W2,seg,seg);
  g.rotateX(-Math.PI/2);
  var pos=g.attributes.position, n=pos.count, col=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var x=pos.getX(i), z=pos.getZ(i);
    pos.setY(i, PW_Y-PW_BED+(fbm(x*0.06+3.0, z*0.06-8.0, 2)-0.5)*1.3);
    var r2=Math.sqrt(x*x+z*z), pr2=pondEdgeR(x,z);
    var t2=clampf((r2-pr2*0.30)/(pr2*0.95), 0, 1); t2=t2*t2*(3-2*t2);
    var inside2=1-t2;
    var band2=pondBright(x,z)*2.2*(0.50+0.85*fbm(x*0.035+31.0, z*0.035-12.0, 3));
    var hug2=1-0.62*pondRockNear(x,z);
    var fg=pondFootGlow(x,z); fg=fg*fg;                                 // vibrant turquoise where rock meets floor
    col[i*3]  =Math.min((PW_DARK[0]+(PW_DEEP[0]*1.5-PW_DARK[0])*inside2 + PW_GLOW[0]*band2*inside2)*0.5*hug2 + 0.07*fg, 1);
    col[i*3+1]=Math.min((PW_DARK[1]+(PW_DEEP[1]*1.5-PW_DARK[1])*inside2 + PW_GLOW[1]*band2*inside2)*0.5*hug2 + 0.68*fg, 1);
    col[i*3+2]=Math.min((PW_DARK[2]+(PW_DEEP[2]*1.5-PW_DARK[2])*inside2 + PW_GLOW[2]*band2*inside2)*0.5*hug2 + 0.62*fg, 1);
  }
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  envGroup.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true})));
  // subtle pebbles down there: yellow, white, deep blue
  var PBC=[[0.55,0.45,0.12],[0.55,0.58,0.62],[0.06,0.12,0.45]];
  var nPeb=26+((rnd()*16)|0), pmade=0, ptry=0;
  while(pmade<nPeb && ptry++<nPeb*5){
    var pa=rnd()*6.2832, prr=Math.sqrt(rnd())*PW_R*1.0;
    var px2=Math.cos(pa)*prr, pz2=Math.sin(pa)*prr;
    if(pondBright(px2,pz2)<0.12) continue;
    if(envDomeY(px2,pz2)>PW_Y-PW_BED+1.2) continue;                      // not under an island's skirts
    var pg=new THREE.IcosahedronGeometry(0.15+rnd()*0.4, 1);
    var pc=PBC[(rnd()*3)|0], pmat=new THREE.MeshBasicMaterial();
    pmat.color.setRGB(pc[0],pc[1],pc[2]);
    var pm=new THREE.Mesh(pg, pmat);
    pm.scale.y=0.45+rnd()*0.25;
    pm.position.set(px2, PW_Y-PW_BED+(fbm(px2*0.06+3.0, pz2*0.06-8.0, 2)-0.5)*1.3+0.3, pz2);
    pm.rotation.y=rnd()*6.2832;
    envGroup.add(pm);
    pmade++;
  }
  // turquoise grains along each rock's foot
  for(var ti2=0;ti2<envRocks.length;ti2++){
    var to2=envRocks[ti2];
    var tn2=Math.max(120, Math.min(520, Math.round(3.1416*(to2.rx+to2.rz)*2.4)));
    for(var tk=0;tk<tn2;tk++){
      var tfa=rnd()*6.2832;
      var tfr=pondFootR(to2,tfa)*0.99;
      var tex=Math.cos(tfa)*to2.rx*tfr, tez=Math.sin(tfa)*to2.rz*tfr;
      var tl4=Math.sqrt(tex*tex+tez*tez)||1;
      var toff=(rnd()-0.45)*1.2 + Math.pow(rnd(),1.7)*2.2;               // hugging, with a thin outward tail
      tex+=(tex/tl4)*toff; tez+=(tez/tl4)*toff;
      var twx=tex*to2.c-tez*to2.s, twz=tex*to2.s+tez*to2.c;
      var tx3=to2.x+twx, tz3=to2.z+twz;
      addDot(tx3, PW_Y-PW_BED+(fbm(tx3*0.06+3.0, tz3*0.06-8.0, 2)-0.5)*1.3+0.35, tz3,
             [0.08+rnd()*0.06, 0.72+rnd()*0.22, 0.75+rnd()*0.2], 0.10+rnd()*0.12);
    }
  }
  // dappled grains on the floor
  var N=2600, tries=N*3, made=0;
  for(var k=0;k<tries && made<N;k++){
    var a=rnd()*6.2832, r=Math.sqrt(rnd())*PW_R*1.05;
    var bx=Math.cos(a)*r, bz=Math.sin(a)*r;
    var b2=pondBright(bx,bz);
    if(b2<rnd()) continue;
    var mm=(0.3+rnd()*0.7)*b2;
    addDot(bx, PW_Y-PW_BED+(fbm(bx*0.06+3.0, bz*0.06-8.0, 2)-0.5)*1.3+0.25, bz,
           [0.02+0.05*mm, 0.05+0.13*mm, 0.10+0.30*mm], 0.12+rnd()*0.22);
    made++;
  }
}

function buildPondWater(){
  var seg=150, W2=FIELD_R*2.4;
  var g=new THREE.PlaneGeometry(W2,W2,seg,seg);
  g.rotateX(-Math.PI/2);
  var pos=g.attributes.position, n=pos.count, col=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var x=pos.getX(i), z=pos.getZ(i);
    pos.setY(i, PW_Y-0.12);
    var r=Math.sqrt(x*x+z*z), pr=pondEdgeR(x,z);
    var t=clampf((r-pr*0.30)/(pr*0.95), 0, 1); t=t*t*(3-2*t);   // the coast is a whole journey now
    var inside=1-t;                                                     // 1 in the pool
    var band=pondBright(x,z)*2.2;                                       // a wash, not a ring
    band*= 0.50+0.85*fbm(x*0.035+31.0, z*0.035-12.0, 3);
    var R=PW_DARK[0]+(PW_DEEP[0]*1.5-PW_DARK[0])*inside + PW_GLOW[0]*band*inside;
    var G=PW_DARK[1]+(PW_DEEP[1]*1.5-PW_DARK[1])*inside + PW_GLOW[1]*band*inside;
    var B=PW_DARK[2]+(PW_DEEP[2]*1.5-PW_DARK[2])*inside + PW_GLOW[2]*band*inside;
    var hug=1-0.62*pondRockNear(x,z);                                   // the film goes near-black over the flanks,
    R*=hug; G*=hug; B*=hug;                                             // so the drowned rock reads through dark
    col[i*3]=Math.min(R,1); col[i*3+1]=Math.min(G,1); col[i*3+2]=Math.min(B,1);
  }
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  // a film, not a floor: it draws after the swimmers, so they show through it
  var wm=new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.DoubleSide,
    transparent:true, opacity:0.58, depthWrite:false
  }));
  wm.renderOrder=0;
  waterGroup.add(wm);
}

function buildPondHaze(){                        // soft additive sprites: the bloom over the shallows
  var N=4200, P=[], S=[], made=0, guard=N*4;
  while(made<N && guard-->0){
    var a=rnd()*6.2832, r=Math.sqrt(rnd())*PW_R*1.28;
    var x=Math.cos(a)*r, z=Math.sin(a)*r, pr=pondEdgeR(x,z);
    var band=pondBright(x,z);
    if(band<rnd()) continue;
    P.push(x, PW_Y+0.3+rnd()*2.6, z);
    S.push(3.0+rnd()*6.2);
    made++;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(P),3));
  g.setAttribute("hsize",    new THREE.BufferAttribute(new Float32Array(S),1));
  envHazeMat=new THREE.ShaderMaterial({
    uniforms:{ uProj:{value:projScale} },
    vertexShader:[
      "attribute float hsize; uniform float uProj;",
      "void main(){",
      "  vec4 mv=modelViewMatrix*vec4(position,1.0);",
      "  gl_PointSize=clamp(hsize*uProj/max(-mv.z,0.001),1.0,96.0);",
      "  gl_Position=projectionMatrix*mv;",
      "}"].join("\n"),
    fragmentShader:[
      "precision mediump float;",
      "void main(){",
      "  vec2 uv=gl_PointCoord-0.5; float d2=dot(uv,uv);",
      "  if(d2>0.25) discard;",
      "  float a=1.0-sqrt(d2)*2.0; a=a*a*0.15;",
      "  gl_FragColor=vec4(0.12,0.35,1.0,1.0)*a;",
      "}"].join("\n"),
    blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
  });
  var pts=new THREE.Points(g, envHazeMat);
  pts.frustumCulled=false;
  pts.renderOrder=1;                               // over the water film
  waterGroup.add(pts);
}

function buildPondGrass(){                       // yellow seaweed, growing in clumps
  var breach=[];
  var nClu=Math.round(16*params.grass), target=nClu*46, tries=target*3;
  var cx2=[], cz2=[], made=0, g2i=0;
  while(made<nClu && g2i++<nClu*14){               // clump homes gather at the rock feet, by the turquoise
    var ho=envRocks[(rnd()*envRocks.length)|0];
    var ca=rnd()*6.2832, hlw=pondLobe(ho,ca);
    var hyl=clampf((PW_Y-PW_BED-ho.cy)/ho.ry, -0.98, 0);
    var hs=Math.sqrt(1-hyl*hyl)*0.94;
    var hrr=hs*hlw*(1.10+rnd()*0.55);              // just beyond the ring
    var hex=Math.cos(ca)*ho.rx*hrr, hez=Math.sin(ca)*ho.rz*hrr;
    var hx=ho.x+hex*ho.c-hez*ho.s, hz=ho.z+hex*ho.s+hez*ho.c;
    if(onIsland(hx,hz,1.10)) continue;
    if(Math.hypot(hx,hz)>PW_R*1.1) continue;
    cx2.push(hx); cz2.push(hz); made++;
  }
  var pos=new Float32Array(target*12), col=new Float32Array(target*12), n=0;
  for(var i=0;i<tries && n<target && made>0;i++){
    var ci=(rnd()*made)|0;
    var ra=rnd()*6.2832, rr2=Math.pow(rnd(),0.6)*(2.4+rnd()*2.2);
    var x=cx2[ci]+Math.cos(ra)*rr2, z=cz2[ci]+Math.sin(ra)*rr2;
    if(onIsland(x,z,1.06)) continue;
    if(envDomeY(x,z)>PW_Y-PW_BED+1.4) continue;                          // not through a rock's skirts
    var glow=pondBright(x,z);
    var tall=rnd()<0.12;
    var y0=PW_Y-PW_BED+(fbm(x*0.06+3.0, z*0.06-8.0, 2)-0.5)*1.3;         // rooted on the bed
    var h=tall ? PW_BED+0.8+rnd()*3.2 : 3.5+rnd()*5.0;                   // the tall ones break the surface
    var fa=fbm(x*0.02+51.0, z*0.02+13.0, 2)*12.566+(rnd()-0.5)*1.6;
    var lm=(0.5+rnd()*1.1)*(tall?1.6:1);
    var lx=Math.cos(fa)*lm, lz=Math.sin(fa)*lm;
    var gt=clampf(0.35+glow*0.45+(rnd()-0.5)*0.2, 0, 1);
    var r0=0.80+0.20*gt, g0=0.64+0.19*gt, b0=0.04+0.04*gt;                 // #ffd312, same as the lichen
    var m0=0.25;                                                         // roots dim in the deep
    var o=n*12;
    pos[o]=x;           pos[o+1]=y0;          pos[o+2]=z;
    pos[o+3]=x+lx*0.35; pos[o+4]=y0+h*0.62;   pos[o+5]=z+lz*0.35;
    pos[o+6]=pos[o+3];  pos[o+7]=pos[o+4];    pos[o+8]=pos[o+5];
    pos[o+9]=x+lx;      pos[o+10]=y0+h;       pos[o+11]=z+lz;
    if(tall && y0+h>PW_Y+0.4 && rnd()<0.30){                             // it breaches: a little foam pool
      var bfr=clampf((PW_Y-y0)/h, 0, 1);
      breach.push([x+lx*bfr*0.55, z+lz*bfr*0.55]);
    }
    col[o]  =r0*m0; col[o+1]=g0*m0; col[o+2]=b0*m0;
    col[o+3]=r0;    col[o+4]=g0;    col[o+5]=b0;
    col[o+6]=r0;    col[o+7]=g0;    col[o+8]=b0;
    col[o+9]=r0*0.85; col[o+10]=g0*0.9; col[o+11]=b0*0.85;
    n++;
  }
  envGroup.add(fatFloraSegments(pos.subarray(0,n*12), col.subarray(0,n*12), 0.38));
  for(var bi=0;bi<breach.length;bi++){
    speckCluster(breach[bi][0], breach[bi][1], 10+((rnd()*14)|0), 0.7+rnd()*0.9, 0.5);
  }
}

function buildPondFlora(){                       // foam bursts around the margin
  // (the reed bursts and pin tufts walked off to join the creatures — buildBurst / buildPinTuft)
  var mul=params.flowers, i;
}

function buildPondSpecks(){                      // the dark hinterland: a woven teal texture out to black
  var i, N=8500;
  for(i=0;i<N;i++){
    var a=rnd()*6.2832;
    var r=PW_R*(0.95+Math.pow(rnd(),0.85)*1.15);
